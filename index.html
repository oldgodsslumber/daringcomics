// ═══════════════════════════════════════════════════════════
// PRINT CENTRE  (desktop only — see #nb-print in the stylesheet)
// ═══════════════════════════════════════════════════════════
// Pick anything you've made — heroes, the team, rogues, cast, goons, region
// maps, the issue log — and collate it into one paper document for table play.
// Wiki/lore entries are deliberately excluded; they're reference, not play aids.
//
// A selection is an ordered list of {k,id,d}: category key, item id, density.
// Density decides the layout class, and consecutive items sharing a layout are
// packed onto shared pages (2 halves, 4 cards, 8 strips) without losing order.

const PR_DENS={full:{label:'Full page',per:1},half:{label:'Half page',per:2},card:{label:'Quarter card',per:4},strip:{label:'Stat strip',per:8},flow:{label:'Flowed text',per:1},table:{label:'Table',per:1}};
let _prSel=null,_prOpts=null,_prDragFrom=null;

function prLoadPrefs(){
  if(_prSel)return;
  try{const p=JSON.parse(localStorage.getItem('dc_print_prefs'))||{};
    _prSel=Array.isArray(p.items)?p.items:[];
    _prOpts=Object.assign({toc:true,guides:true,ink:false,paper:'letter'},p.opts||{});
  }catch(e){_prSel=[];_prOpts={toc:true,guides:true,ink:false,paper:'letter'};}
}
function prSavePrefs(){try{localStorage.setItem('dc_print_prefs',JSON.stringify({items:_prSel,opts:_prOpts}));}catch(e){}}

// ─── what's available to print ───────────────────────────────────────────
// Each category yields {key,label,hint,dens[],def,items[{id,name,sub,tag}]}.
function prCatalog(){
  const cats=[],np=S.npcs||[];
  const mine=n=>!n.fromHero;
  const heroDens=['full','half','card'];
  if(S.char)cats.push({key:'hero',label:'Hero',hint:'The hero in this save slot',dens:heroDens,def:'full',
    items:[{id:'@self',name:S.char.costumedName||'Unnamed Hero',sub:S.char.civilianName||''}]});
  // Heroes parked in other save slots bound to the same universe
  const others=(S.universeId?listSaves(S.universeId):listSaves()).filter(s=>s.started&&s.id!==currentSaveId);
  if(others.length)cats.push({key:'slot',label:'Other heroes',hint:'Other save slots in this universe — printed with their own tone',dens:heroDens,def:'full',
    items:others.map(s=>({id:s.id,name:s.name||'Unnamed Hero',sub:s.civilianName||''}))});
  // Multiplayer: teammates' heroes mirrored into the roster
  const players=np.filter(n=>n.fromHero&&!(S.char&&n.heroId===S.char.heroId));
  if(players.length)cats.push({key:'player',label:'Player heroes',hint:'Mirrored from other players at your table',dens:heroDens,def:'full',
    items:players.map(n=>({id:n.id,name:n.name,sub:n.desc||''}))});
  if(S.team){const it=[{id:'@team',name:S.team.name||'Super Team',sub:S.team.charter||''}];
    if(S.team.expanded)it.push({id:'@expanded',name:(S.team.name||'Team')+' — Expanded Roster',sub:'Peripheral-adventure statblock'});
    cats.push({key:'team',label:'Super team',hint:'Charter, friction, stunts and complications',dens:['full'],def:'full',items:it});}
  const grp=(t,label,hint,dens,def)=>{const l=np.filter(n=>n.type===t&&mine(n));
    if(l.length)cats.push({key:t,label,hint,dens,def,items:l.map(n=>({id:n.id,name:n.name,sub:n.desc||'',tag:t==='nameless'?('Obstacle '+(n.obstacle||'+0')):''}))});};
  grp('main','Main NPCs','Built like heroes — full sheets',heroDens,'full');
  grp('rogue','Rogues / villains','Half a page each, two to a sheet',['half','full','card'],'half');
  grp('supporting','Supporting cast','Four index cards to a sheet',['card','half','full'],'card');
  grp('nameless','Nameless goons','Eight stat strips to a sheet',['strip','card'],'strip');
  const regs=[];
  (S.regions||[]).forEach((r,ri)=>{regs.push({id:'r'+ri,name:r.name||('Region '+(ri+1)),sub:'5×5 region map'});
    (r.cells||[]).forEach((c,ci)=>{if(c.subZone)regs.push({id:'r'+ri+'z'+ci,name:c.subZone.name||c.name||('Area '+(ci+1)),sub:'Sub-zone of '+(r.name||'region')});});});
  if(regs.length)cats.push({key:'region',label:'Region maps',hint:'Grid plus a key of every named location',dens:['full','half'],def:'full',items:regs});
  const iss=parseIssues(S.notes||[]);
  const withEntries=iss.map((g,i)=>({g,i})).filter(x=>x.g.entries.length);
  if(withEntries.length)cats.push({key:'log',label:'Issue log',hint:'Your campaign log, one section per issue',dens:['flow'],def:'flow',
    items:withEntries.map(x=>({id:'i'+x.i,name:x.g.label,sub:x.g.entries.length+' entr'+(x.g.entries.length===1?'y':'ies')}))});
  cats.push({key:'ref',label:'Reference',hint:'Built from whatever else you selected',dens:['table'],def:'table',
    items:[{id:'@gear',name:'Gear table',sub:'Every item carried by the sheets in this document'},
           {id:'@blank',name:'Blank notes page',sub:'Ruled page for session notes'}]});
  return cats;
}
function prFindCat(cats,k){return cats.find(c=>c.key===k);}
function prItemName(cats,s){const c=prFindCat(cats,s.k);const it=c&&c.items.find(i=>i.id===s.id);return it?it.name:null;}
function prSelIdx(k,id){prLoadPrefs();return _prSel.findIndex(s=>s.k===k&&s.id===id);}

// ─── selection mutators ──────────────────────────────────────────────────
function prToggle(k,id,def){prLoadPrefs();const i=prSelIdx(k,id);
  if(i>=0)_prSel.splice(i,1);else _prSel.push({k,id,d:def});prSavePrefs();renderPrintCentre();}
function prSetDens(k,id,d){const i=prSelIdx(k,id);if(i>=0)_prSel[i].d=d;prSavePrefs();renderPrintCentre();}
function prCatAll(k,on){prLoadPrefs();const c=prFindCat(prCatalog(),k);if(!c)return;
  if(!on){_prSel=_prSel.filter(s=>s.k!==k);}
  else c.items.forEach(it=>{if(prSelIdx(k,it.id)<0)_prSel.push({k,id:it.id,d:c.def});});
  prSavePrefs();renderPrintCentre();}
function prSelectAll(){prLoadPrefs();_prSel=[];prCatalog().forEach(c=>{if(c.key==='ref')return;
  c.items.forEach(it=>_prSel.push({k:c.key,id:it.id,d:c.def}));});prSavePrefs();renderPrintCentre();}
function prClear(){_prSel=[];prSavePrefs();renderPrintCentre();}
function prMove(i,d){prLoadPrefs();const j=i+d;if(j<0||j>=_prSel.length)return;
  const it=_prSel.splice(i,1)[0];_prSel.splice(j,0,it);prSavePrefs();renderPrintCentre();}
function prRemove(i){prLoadPrefs();_prSel.splice(i,1);prSavePrefs();renderPrintCentre();}
function prOpt(name,v){prLoadPrefs();_prOpts[name]=v;prSavePrefs();renderPrintCentre();}
// Drag-reorder of the assembled list (same handler shape as the log reorder)
function prDS(e,i){_prDragFrom=i;e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='.4';}
function prDO(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('pr-over');}
function prDL(e){e.currentTarget.classList.remove('pr-over');}
function prDD(e,t){e.preventDefault();e.currentTarget.classList.remove('pr-over');
  const s=_prDragFrom;_prDragFrom=null;if(s==null||s===t)return;
  prLoadPrefs();const it=_prSel.splice(s,1)[0];_prSel.splice(s<t?t-1:t,0,it);prSavePrefs();renderPrintCentre();}

// Runs of consecutive same-layout items share pages, so the estimate has to walk
// the list in order rather than just totalling per-item fractions.
function prPageCount(){prLoadPrefs();const runs=prRuns();let n=_prOpts.toc?1:0;
  runs.forEach(r=>{const per=(PR_DENS[r.d]||PR_DENS.full).per;n+=Math.ceil(r.items.length/per);});return n;}
function prRuns(){prLoadPrefs();const runs=[];
  _prSel.forEach(s=>{const last=runs[runs.length-1];
    if(last&&last.d===s.d&&s.d!=='full'&&s.d!=='flow'&&s.d!=='table')last.items.push(s);
    else runs.push({d:s.d,items:[s]});});
  return runs;}

// ─── the picker page ─────────────────────────────────────────────────────
function renderPrintCentre(){
  const el=document.getElementById('print-content');if(!el)return;
  prLoadPrefs();
  if(window.matchMedia&&!window.matchMedia('(min-width:700px)').matches){
    el.innerHTML=`<div class="card tac"><div class="pg-title" style="font-size:18px">Desktop only</div><div class="pg-sub">The print centre needs a wider screen — open the app on a computer to collate sheets.</div></div>`;return;}
  const cats=prCatalog();
  // prune selections whose source is gone (deleted NPC, disbanded team, …)
  const before=_prSel.length;
  _prSel=_prSel.filter(s=>prItemName(cats,s)!==null);
  if(_prSel.length!==before)prSavePrefs();

  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:4px"><div><div class="pg-title">Print</div><div class="pg-sub">Collate sheets for in-person play</div></div><div style="display:flex;gap:6px"><button class="btn btn-secondary btn-xs" onclick="prSelectAll()">Select everything</button><button class="btn btn-secondary btn-xs" onclick="prClear()">Clear</button></div></div>`;
  h+=`<div class="pr-wrap">`;

  // ── left: catalogue ──
  h+=`<div class="pr-col">`;
  if(!cats.length)h+=`<div class="card tac text-muted">Nothing to print yet — make a hero, some NPCs or a map first.</div>`;
  cats.forEach(c=>{
    const chosen=c.items.filter(it=>prSelIdx(c.key,it.id)>=0).length;
    h+=`<div class="card" style="padding:11px">`;
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><div class="label" style="margin:0;flex:1">${esc(c.label)} <span class="text-muted" style="font-weight:400">${chosen}/${c.items.length}</span></div>`;
    h+=`<button class="btn btn-secondary btn-xs" onclick="prCatAll('${c.key}',${chosen<c.items.length})">${chosen<c.items.length?'All':'None'}</button></div>`;
    h+=`<div style="font-size:10px;color:var(--muted);margin-bottom:7px">${esc(c.hint)}</div>`;
    c.items.forEach(it=>{
      const si=prSelIdx(c.key,it.id),on=si>=0;
      h+=`<div class="pr-item${on?' on':''}">`;
      h+=`<label style="display:flex;gap:8px;align-items:flex-start;flex:1;cursor:pointer;min-width:0"><input type="checkbox" ${on?'checked':''} onchange="prToggle('${c.key}','${it.id}','${c.def}')" style="margin-top:2px">`;
      h+=`<div style="min-width:0"><div class="fw-700" style="font-size:13px">${esc(it.name)}</div>`;
      if(it.sub)h+=`<div style="font-size:11px;color:var(--muted)">${esc(it.sub)}</div>`;
      if(it.tag)h+=`<div style="font-size:10px;color:var(--accent)">${esc(it.tag)}</div>`;
      h+=`</div></label>`;
      if(on&&c.dens.length>1){
        h+=`<select onchange="prSetDens('${c.key}','${it.id}',this.value)" style="flex:0 0 auto;font-size:11px;padding:3px 5px">`;
        c.dens.forEach(d=>{h+=`<option value="${d}" ${_prSel[si].d===d?'selected':''}>${PR_DENS[d].label}</option>`;});
        h+=`</select>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;

  // ── right: assembled document ──
  h+=`<div class="pr-col pr-doc">`;
  h+=`<div class="card" style="padding:11px"><div class="label mb-1">Document <span class="text-muted" style="font-weight:400">${_prSel.length} item${_prSel.length===1?'':'s'} · ≈${prPageCount()} page${prPageCount()===1?'':'s'}</span></div>`;
  if(!_prSel.length)h+=`<div style="font-size:11px;color:var(--muted);padding:14px 0;text-align:center;border:1px dashed var(--border);border-radius:var(--radius-card)">Tick things on the left. Drag to reorder them here.</div>`;
  _prSel.forEach((s,i)=>{
    const nm=prItemName(cats,s)||'—';
    h+=`<div class="pr-row" draggable="true" ondragstart="prDS(event,${i})" ondragend="this.style.opacity=''" ondragover="prDO(event)" ondragleave="prDL(event)" ondrop="prDD(event,${i})">`;
    h+=`<span class="pr-grip">⋮⋮</span><div style="flex:1;min-width:0"><div class="fw-700" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(nm)}</div><div style="font-size:10px;color:var(--muted)">${PR_DENS[s.d]?PR_DENS[s.d].label:s.d}</div></div>`;
    h+=`<button class="btn btn-secondary btn-xs" onclick="prMove(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn btn-secondary btn-xs" onclick="prMove(${i},1)" ${i===_prSel.length-1?'disabled':''}>↓</button><button class="btn btn-danger btn-xs" onclick="prRemove(${i})">✕</button></div>`;
  });
  h+=`</div>`;
  h+=`<div class="card" style="padding:11px"><div class="label mb-1">Paper</div>`;
  h+=`<label class="pr-opt"><input type="checkbox" ${_prOpts.toc?'checked':''} onchange="prOpt('toc',this.checked)"> Contents page</label>`;
  h+=`<label class="pr-opt"><input type="checkbox" ${_prOpts.guides?'checked':''} onchange="prOpt('guides',this.checked)"> Cut guides on card sheets</label>`;
  h+=`<label class="pr-opt"><input type="checkbox" ${_prOpts.ink?'checked':''} onchange="prOpt('ink',this.checked)"> Ink saver</label>`;
  h+=`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:11px;color:var(--muted)">Size</span><select onchange="prOpt('paper',this.value)" style="font-size:11px;padding:3px 5px"><option value="letter" ${_prOpts.paper==='letter'?'selected':''}>Letter</option><option value="a4" ${_prOpts.paper==='a4'?'selected':''}>A4</option></select></div>`;
  h+=`<div style="font-size:10px;color:var(--muted);margin-top:6px">All four can also be flipped in the preview window before you print.</div></div>`;
  h+=`<button class="btn btn-primary btn-full" ${_prSel.length?'':'disabled'} onclick="prOpenDoc()">🖨 Open print preview</button>`;
  h+=`</div></div>`;
  el.innerHTML=h;
}

// ─── page builders ───────────────────────────────────────────────────────
function prE(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function prBoxes(n){let o='';for(let i=0;i<n;i++)o+=`<span class="sb">${i+1}</span>`;return o;}
function prRules(n){let o='';for(let i=0;i<n;i++)o+='<span class="rule"></span>';return o;}
function prPage(title,kicker,body){return `<section class="pg"><div class="pg-h"><div class="pg-h-t">${prE(title)}</div><div class="pg-h-s">${prE(kicker||'Daring Comics')}</div></div>${body}</section>`;}

// A character-shaped object as a quarter-page index card.
function prCharCard(ch,role){
  const sk=SKILLS.filter(s=>(ch.skills&&ch.skills[s])>0).sort((a,b)=>ch.skills[b]-ch.skills[a]).slice(0,5);
  const asp=[ch.aspects&&ch.aspects.concept,ch.aspects&&ch.aspects.motivation].filter(Boolean);
  const pw=[];(ch.forms||[]).forEach(f=>(f.powerSets||[]).forEach(ps=>(ps.powers||[]).forEach(p=>{
    const pd=POWERS.find(x=>x.id===p.powerId);pw.push((p.customName||(pd&&pd.name)||p.name||'Power')+(p.level>1?' Lv'+p.level:''));})));
  const nPhys=((ch.stress&&ch.stress.physical)||[]).length+((ch.hardStress||[]).length),nMent=((ch.stress&&ch.stress.mental)||[]).length;
  let h=`<div class="card4"><div class="c4-n">${prE(ch.costumedName)}</div><div class="c4-r">${prE(role||'')}${ch.civilianName?' · '+prE(ch.civilianName):''}</div>`;
  if(asp.length)h+=`<div class="c4-d">${asp.map(prE).join(' · ')}</div>`;
  if(sk.length)h+=`<div class="c4-l">Skills</div><div class="c4-v">${sk.map(s=>prE(s)+' +'+ch.skills[s]).join(', ')}</div>`;
  if(pw.length)h+=`<div class="c4-l">Powers</div><div class="c4-v">${pw.slice(0,6).map(prE).join(', ')}${pw.length>6?' …':''}</div>`;
  if((ch.stunts||[]).length)h+=`<div class="c4-l">Stunts</div><div class="c4-v">${ch.stunts.map(s=>prE(s.name)).join(', ')}</div>`;
  h+=`<div class="c4-l">Stress</div><div class="c4-v">P ${prBoxes(nPhys||3)} &nbsp; M ${prBoxes(nMent||3)}</div>`;
  h+=`<div class="c4-l">Notes</div>${prRules(2)}</div>`;
  return h;
}
// A raw roster NPC as a quarter-page index card (cast and goons never get built
// out in the full builder, so this reads the stored fields directly).
function prNpcCard(n){
  const role=NPC_TYPE_LABELS[n.type]||'NPC';
  const sk=Object.entries(n.skills||{}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let h=`<div class="card4"><div class="c4-n">${prE(n.name)}</div><div class="c4-r">${prE(role)}${n.obstacle?' · Obstacle '+prE(n.obstacle):''}</div>`;
  if(n.desc)h+=`<div class="c4-d">${prE(n.desc)}</div>`;
  if((n.aspects||[]).length)h+=`<div class="c4-l">Aspects</div><div class="c4-v">${n.aspects.map(prE).join(' · ')}</div>`;
  if(sk.length)h+=`<div class="c4-l">Skills</div><div class="c4-v">${sk.map(x=>prE(x[0])+' +'+x[1]).join(', ')}</div>`;
  else if(n.skillText)h+=`<div class="c4-l">Skills</div><div class="c4-v">${prE(n.skillText)}</div>`;
  if(n.powers)h+=`<div class="c4-l">Powers</div><div class="c4-v">${prE(n.powers)}</div>`;
  h+=`<div class="c4-l">Stress</div><div class="c4-v">${prBoxes((n.stress||[]).length||2)}</div>`;
  h+=`<div class="c4-l">Notes</div>${prRules(2)}</div>`;
  return h;
}
function prNpcStrip(n){
  const sk=Object.entries(n.skills||{}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(x=>prE(x[0])+' +'+x[1]).join(', ');
  const bits=[sk||prE(n.skillText||''),prE(n.desc||''),prE(n.powers||'')].filter(Boolean).join(' — ');
  return `<div class="strip"><div class="strip-n">${prE(n.name)}</div><div class="strip-o">${prE(n.obstacle||'+0')}</div><div class="strip-d">${bits||'&nbsp;'}</div><div class="strip-s">${prBoxes((n.stress||[]).length||2)}</div></div>`;
}
// Team sheet — the charter block, plus the expanded roster as its own statblock.
function prTeamHTML(which){
  const t=S.team;if(!t)return'';
  const{tone}=getSeriesConfig();
  if(which==='@team'){
    const mx=(S.char?1:0)+(t.rogues||[]).length;
    let l='',r='';
    l+=`<div class="sec"><div class="sec-t">Charter</div><div class="asp">${prE(t.charter)||'<span class="con-line"></span>'}</div></div>`;
    l+=`<div class="sec"><div class="sec-t">Friction</div><div class="asp">${prE(t.friction)||'<span class="con-line"></span>'}</div></div>`;
    l+=`<div class="sec"><div class="sec-t">Team Rogues</div>`;
    if((t.rogues||[]).length)t.rogues.forEach(x=>{l+=`<div class="cast-item"><span class="cast-n">${prE(x.name)}</span><span class="cast-d">${prE(x.desc)}</span></div>`;});
    else l+=`<div class="c4-v">${prRules(3)}</div>`;
    l+=`</div>`;
    l+=`<div class="sec"><div class="sec-t">Roster</div>`;
    if(S.char)l+=`<div class="cast-item"><span class="cast-n">${prE(S.char.costumedName)}</span><span class="cast-d">${prE(S.char.civilianName||'')}</span></div>`;
    (S.npcs||[]).filter(n=>n.fromHero&&!(S.char&&n.heroId===S.char.heroId)).forEach(n=>{
      l+=`<div class="cast-item"><span class="cast-n">${prE(n.name)}</span><span class="cast-d">${prE(n.desc||'')}</span></div>`;});
    l+=`</div>`;
    r+=`<div class="sec"><div class="sec-t">Team Stunts (${(t.stunts||[]).length}/${mx})</div>`;
    (t.stunts||[]).forEach(id=>{const d=TEAM_STUNTS.find(x=>x.id===id);if(d)r+=`<div class="st-item"><span class="st-n">${prE(d.name)}</span><div class="st-d">${prE(d.desc)}</div></div>`;});

  l+=`</div><div class="sec"><div class="sec-t">Stress</div><div class="stress-row"><div class="stress-l">Physical</div>${prBoxes(smax)}</div><div class="stress-row"><div class="stress-l">Mental</div>${prBoxes(smax)}</div></div>`;

  l+=`</div>`;

  (ex.powers||[]).forEach(p=>{const pd=p.powerId?POWERS.find(x=>x.id===p.powerId):null;
    r+=`<div class="pw-item"><span class="pw-n">${prE(p.customName||(pd&&pd.name)||p.name||'Power')}</span>${p.level>1?' <span class="pw-lv">Lv'+p.level+'</span>':''} <span class="pw-c">(${p.totalCost||p.cost||0} HP)</span>${pd&&pd.desc?`<div class="pw-desc">${prE(pd.desc)}</div>`:(p.desc?`<div class="pw-desc">${prE(p.desc)}</div>`:'')}</div>`;});
  if(!(ex.stunts||[]).length&&!(ex.powers||[]).length)r+=`<div class="c4-v">${prRules(3)}</div>`;

}
// Region / sub-zone map: the grid, then a key of every named cell.
function prMapHTML(id,half){
  const m=/^r(\d+)(?:z(\d+))?$/.exec(id);if(!m)return'';
  const reg=(S.regions||[])[+m[1]];if(!reg)return'';
  let cells,name,kicker,cur;
  if(m[2]!==undefined){const c=(reg.cells||[])[+m[2]];const sz=c&&c.subZone;if(!sz)return'';
    cells=sz.cells||[];name=sz.name||c.name||'Sub-zone';kicker='SUB-ZONE OF '+(reg.name||'').toUpperCase();
    cur=sz.currentCell;}
  else{cells=reg.cells||[];name=reg.name||'Region';kicker='REGION MAP';cur=reg.currentCell;}
  let g='<div class="map">';
  for(let i=0;i<25;i++){const c=cells[i]||{};
    let cls='mc';if(c.isVoid)cls+=' mc-void';else if(i===cur)cls+=' mc-cur';
    let ico='';
    if(c.icon)ico=isGiSlug(c.icon)
      ?`<img class="mc-i" src="${pdIconUrl(c.icon.indexOf(':')>=0?c.icon:'game-icons:'+c.icon)}">`
      :`<span style="font-size:19pt;line-height:1">${prE(c.icon)}</span>`;
    g+=`<div class="${cls}">${ico}${c.name?`<span class="mc-n">${prE(c.name)}</span>`:''}</div>`;}
  g+='</div>';
  let key='';
  cells.forEach((c,i)=>{if(!c||c.isVoid||(!c.name&&!c.notes&&!c.feature))return;
    key+=`<div><b>${i+1}. ${prE(c.name||'Unnamed')}</b>${c.feature?' — '+prE(c.feature):''}${c.notes?' · '+prE(c.notes):''}${c.subZone?' <span class="pw-c">[sub-zone]</span>':''}</div>`;});
  if(!key)key='<div class="text-muted">No locations named yet.</div>';
  const body=`${g}<div class="sec"><div class="sec-t">Key</div><div class="map-key">${key}</div></div>`;
  if(half)return `<section class="sheet sheet-half"><div class="hdr"><div><div class="h-name">${prE(name)}</div></div><div class="h-right"><div class="h-sub">${prE(kicker)}</div></div></div>${body}</section>`;
  return prPage(name,kicker,body);
}
function prLogHTML(id){
  const iss=parseIssues(S.notes||[]);const g=iss[+String(id).slice(1)];if(!g)return'';
  let b=`<div class="iss">${prE(g.label)}</div>`;
  g.entries.forEach(en=>{b+=`<div class="log-e"><div class="log-t">${prE(en.emoji||'')} ${prE(en.title||'Entry')}</div><div class="log-m">${prE((LOG_TYPES.find(t=>t.key===en.type)||{}).label||en.type||'')}${en.date?' · '+prE(en.date):''}</div>${en.body?`<div class="log-b">${prE(en.body)}</div>`:''}</div>`;});
  return b;
}
// Gear table, built from every character sheet in the assembled document.
function prGearHTML(chars){
  const rows=[];
  chars.forEach(c=>{(c.ch.forms||[]).forEach(f=>{(f.gear||[]).forEach(it=>{
    const g=it.custom?null:GEAR.find(x=>x.id===it.gearId);
    rows.push({who:c.name,form:(c.ch.forms||[]).length>1?(f.name||''):'',
      name:it.customName||(g?g.name:(it.name||'Item')),cat:g?g.cat:(it.cat||''),
      stat:g?(g.cat==='Armor'?'Armor '+g.armor:(g.rating!==undefined?'Weapon '+g.rating+(g.range!==undefined?' · Range '+g.range:''):'')):'',
      special:(g?g.special:it.special)||[]});});});});
  if(!rows.length)return prPage('Gear','REFERENCE','<div class="map-key text-muted">None of the selected sheets carry gear.</div>');
  rows.sort((a,b)=>a.who.localeCompare(b.who)||a.name.localeCompare(b.name));
  let t=`<table class="gt"><tr><th>Carried by</th><th>Item</th><th>Type</th><th>Rating</th><th>Special</th></tr>`;
  rows.forEach(r=>{t+=`<tr><td>${prE(r.who)}${r.form?' <span class="pw-c">('+prE(r.form)+')</span>':''}</td><td class="gear-n">${prE(r.name)}</td><td>${prE(r.cat)}</td><td class="gear-stat">${prE(r.stat)}</td><td class="gear-special">${prE(r.special.join(', '))}</td></tr>`;});
  t+='</table>';
  return prPage('Gear','REFERENCE',t);
}
function prBlankHTML(){return prPage('Session Notes','','<div class="map-key">'+prRules(30)+'</div>');}

// Resolve one selection entry into the character object a sheet needs.
function prResolveChar(s){
  if(s.k==='hero')return S.char?{ch:S.char,series:null,role:'Hero'}:null;
  if(s.k==='slot'){const st=getSaveData(s.id);if(!st||!st.char)return null;
    const _ids=seriesIdsFor(st);
    return{ch:st.char,role:'Hero',series:{tone:SERIES_TONES.find(t=>t.id===_ids.tone),
      level:SERIES_LEVELS.find(l=>l.id===_ids.level),exp:EXP_LEVELS.find(e=>e.id===_ids.experience)}};}
  const n=(S.npcs||[]).find(x=>x.id===s.id);if(!n)return null;
  if(s.k==='player')return{ch:npcToCharacter(n),role:'Player hero',series:null};
  return{ch:npcToCharacter(n),role:NPC_TYPE_LABELS[n.type]||'NPC',series:null,npc:n};
}
function prRawNpc(s){return (S.npcs||[]).find(x=>x.id===s.id)||null;}

// ─── assemble & open ─────────────────────────────────────────────────────
function prBuildBody(){
  prLoadPrefs();
  const runs=prRuns(),toc=[];
  let out='';
  const noteTOC=(g,n)=>{toc.push({g,n});};
  // Resolved up front so the gear table is complete wherever it sits in the order.
  const chars=[];
  _prSel.forEach(s=>{if(s.k==='team'||s.k==='region'||s.k==='log'||s.k==='ref')return;
    if(s.k==='supporting'||s.k==='nameless')return;
    const r=prResolveChar(s);if(r)chars.push({name:r.ch.costumedName||'Sheet',ch:r.ch});});
  runs.forEach(run=>{
    const d=run.d;
    if(d==='full'||d==='half'){
      let buf=[];
      run.items.forEach(s=>{
        let html='',title='';
        if(s.k==='team'){html=prTeamHTML(s.id);title=((S.team&&S.team.name)||'Team')+(s.id==='@expanded'?' — Expanded Roster':'');noteTOC('Team',title);}
        else if(s.k==='region'){html=prMapHTML(s.id,d==='half');const mm=/^r(\d+)(?:z(\d+))?$/.exec(s.id);
          const reg=(S.regions||[])[+mm[1]];title=mm[2]!==undefined?(((reg.cells||[])[+mm[2]]||{}).subZone||{}).name||'Sub-zone':(reg&&reg.name)||'Region';
          noteTOC('Maps',title);}
        else{const r=prResolveChar(s);if(!r)return;
          html=sheetBodyHTML(r.ch,{series:r.series,half:d==='half',kicker:(r.role||'').toUpperCase()+' SHEET'});
          title=r.ch.costumedName||'Sheet';noteTOC(r.role==='Hero'||r.role==='Player hero'?'Heroes':'NPCs',title);}
        if(!html)return;
        if(d==='full')out+=html;
        else{buf.push(html);if(buf.length===2){out+=`<section class="pg">${buf.join('')}</section>`;buf=[];}}
      });
      if(buf.length)out+=`<section class="pg">${buf.join('')}</section>`;
      return;
    }
    if(d==='card'){
      const cards=[];
      run.items.forEach(s=>{
        if(s.k==='supporting'||s.k==='nameless'){const n=prRawNpc(s);if(n){cards.push(prNpcCard(n));noteTOC('Cards',n.name);}return;}
        const r=prResolveChar(s);if(!r)return;cards.push(prCharCard(r.ch,r.role));noteTOC('Cards',r.ch.costumedName);});
      for(let i=0;i<cards.length;i+=4)out+=prPage(i===0?'Reference Cards':'Reference Cards (cont.)','CUT ALONG THE DASHED LINES','<div class="grid4">'+cards.slice(i,i+4).join('')+'</div>');
      return;
    }
    if(d==='strip'){
      const strips=[];
      run.items.forEach(s=>{const n=prRawNpc(s);if(n){strips.push(prNpcStrip(n));noteTOC('Goons',n.name);}});
      for(let i=0;i<strips.length;i+=8)out+=prPage(i===0?'Nameless Goons':'Nameless Goons (cont.)','OBSTACLE · STRESS',strips.slice(i,i+8).join(''));
      return;
    }
    if(d==='flow'){
      run.items.forEach(s=>{const b=prLogHTML(s.id);if(!b)return;
        const iss=parseIssues(S.notes||[])[+String(s.id).slice(1)];
        noteTOC('Issue log',iss?iss.label:'Issue');out+=prPage('Issue Log','CAMPAIGN RECORD',b);});
      return;
    }
    if(d==='table'){
      run.items.forEach(s=>{
        if(s.id==='@gear'){out+=prGearHTML(chars);noteTOC('Reference','Gear table');}
        else if(s.id==='@blank'){out+=prBlankHTML();noteTOC('Reference','Session notes');}});
      return;
    }
  });
  if(_prOpts.toc&&toc.length){
    const groups={};toc.forEach(t=>{(groups[t.g]=groups[t.g]||[]).push(t.n);});
    let b='<div class="toc">';
    Object.keys(groups).forEach(g=>{b+=`<div class="toc-g">${prE(g)}</div>`;groups[g].forEach(n=>{b+=`<div>${prE(n)}</div>`;});});
    b+='</div>';
    const title=(currentUniverse()&&currentUniverse().name)||'Daring Comics';
    out=prPage(title,'CONTENTS',b)+out;
  }
  return out||'<div class="pg">Nothing selected.</div>';
}

function prOpenDoc(){
  prLoadPrefs();
  if(!_prSel.length)return;
  const body=prBuildBody();
  const n=prPageCount();
  const cls=['previewing',_prOpts.ink?'ink-saver':'',_prOpts.guides?'guides':'no-guides',_prOpts.paper==='a4'?'a4':''].filter(Boolean).join(' ');
  const bar=`<div id="pv-bar"><span class="pv-t">Daring Comics · Print</span><span id="pv-pages">≈${n} sheet${n===1?'':'s'}</span>`
    +`<label><input type="checkbox" ${_prOpts.ink?'checked':''} onchange="document.body.classList.toggle('ink-saver',this.checked)"> Ink saver</label>`
    +`<label><input type="checkbox" ${_prOpts.guides?'checked':''} onchange="document.body.classList.toggle('guides',this.checked);document.body.classList.toggle('no-guides',!this.checked)"> Cut guides</label>`
    +`<select onchange="pvPaper(this.value)"><option value="letter" ${_prOpts.paper==='letter'?'selected':''}>Letter</option><option value="a4" ${_prOpts.paper==='a4'?'selected':''}>A4</option></select>`
    +`<button onclick="window.print()">🖨 Print</button><style id="pv-page"></style></div>`;
  const script='function pvPaper(v){document.body.classList.toggle("a4",v==="a4");'
    +'document.getElementById("pv-page").textContent="@page{size:"+(v==="a4"?"A4":"letter")+" portrait;margin:.5in}";}'
    +'pvPaper('+JSON.stringify(_prOpts.paper)+');';
  const title=((currentUniverse()&&currentUniverse().name)||'Daring Comics')+' — Print';
  dcOpenPrintDoc(prE(title),bar+body,{bodyClass:cls,script:script});
}

// Shared window opener for every printed document.
function dcOpenPrintDoc(title,body,opts){
  opts=opts||{};
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title><style>${dcSheetCSS()}</style></head><body class="${opts.bodyClass||''}">${body}`
    +(opts.script?`<scr`+`ipt>${opts.script}</scr`+`ipt>`:'')+`</body></html>`;
  const w=window.open('','_blank');
  if(!w){alert('Please allow popups to print.');return null;}
  w.document.write(html);w.document.close();w.focus();
  if(opts.autoPrint)setTimeout(()=>{try{w.print();}catch(e){}},500);
  return w;
}

    // Hero Points / Stunts & Powers — supports both legacy {name,desc,cost} and rich {powerId,...} entries
    const exStuntCost=(ex.stunts||[]).reduce((s,st)=>s+(st.cost||0),0);
    const exPowerCost=(ex.powers||[]).reduce((s,p)=>s+(p.totalCost||p.cost||0),0);
    const exHPSpent=exStuntCost+exPowerCost;
    const exHPRem=10-exHPSpent;
    h+=`<div class="divider"></div><div class="label mb-1">Team Stunts & Powers <span class="text-muted" style="font-weight:400">(${exHPSpent}/10 HP)</span></div>`;
    (ex.stunts||[]).forEach((st,i)=>{h+=`<div class="card-sm" style="display:flex;gap:6px;align-items:start"><div style="flex:1"><div class="fw-700" style="font-size:12px">${esc(st.name)} <span class="tag tag-cost">${st.cost} HP</span></div><div style="font-size:11px;color:var(--muted)">${esc(st.desc||'')}</div></div><button class="btn btn-danger btn-xs edit-only" onclick="S.team.expanded.stunts.splice(${i},1);save();renderNPCs()">X</button></div>`;});
    (ex.powers||[]).forEach((pw,i)=>{
      const pd=pw.powerId?POWERS.find(p=>p.id===pw.powerId):null;
      const pwName=pw.customName||pd?.name||pw.name||'Power';
      const pwCost=pw.totalCost||pw.cost||0;
      const isRich=!!pw.powerId;
      h+=`<div class="card-sm" style="display:flex;gap:6px;align-items:start;border-color:var(--purple)"><div style="flex:1"><div class="fw-700" style="font-size:12px">${powerIco(pw)}${esc(pwName)}${pw.level>1?` <span class="text-accent">Lv${pw.level}</span>`:''} <span class="tag tag-cost">${pwCost} HP</span></div>${pd?.desc?`<div style="font-size:11px;color:var(--muted);margin-top:1px">${esc(pd.desc)}</div>`:(pw.desc?`<div style="font-size:11px;color:var(--muted);margin-top:1px">${esc(pw.desc)}</div>`:'')}${pd?.levelDesc&&pd.levelDesc[pw.level]?`<div style="font-size:11px;color:var(--accent);margin-top:1px">${esc(pd.levelDesc[pw.level])}</div>`:''}${pw.selectedSE?.length?'<div style="margin-top:3px">'+pw.selectedSE.map(se=>`<span class="tag tag-se">${esc(se)}</span>`).join(' ')+'</div>':''}${pw.selectedLim?.length?'<div style="margin-top:2px">'+pw.selectedLim.map(l=>`<span class="tag tag-lim">${esc(l)}</span>`).join(' ')+'</div>':''}${pw.flavor?`<div style="font-style:italic;font-size:11px;color:var(--blue);margin-top:6px;padding:5px 7px;background:rgba(52,152,219,.06);border-left:2px solid var(--blue);border-radius:3px">${esc(pw.flavor)}</div>`:''}</div><div class="edit-only" style="display:flex;flex-direction:column;gap:3px;align-self:center">${isRich?`<button class="btn btn-secondary btn-xs" onclick="editPD('team',0,${i})" title="Edit power">Edit</button>`:''}<button class="btn btn-danger btn-xs" onclick="S.team.expanded.powers.splice(${i},1);save();renderNPCs()">X</button></div></div>`;
    });
    if(exHPRem>0){
      h+=`<div class="edit-only" style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-secondary btn-xs" onclick="openTeamStuntBrowser()">+ Sample Stunt</button><button class="btn btn-secondary btn-xs" onclick="addExStunt()">+ Custom Stunt</button><button class="btn btn-gold btn-xs" onclick="openPowerBrowser(0,'team')">+ Power (Browser)</button><button class="btn btn-gold btn-xs" onclick="addExPower()">+ Custom Power</button></div>`;
      h+=renderTeamStuntBrowser();
    }
    // Stress
    h+=`<div class="divider"></div><div class="label mb-1">Team Stress</div>`;
    h+=`<div style="margin-bottom:6px"><span style="font-size:11px;font-weight:700;color:var(--muted)">Physical</span><div style="display:flex;gap:6px;margin-top:3px">`;
    for(let i=0;i<stressMax;i++){h+=`<div class="stress-box ${ex.stress?.physical?.[i]?'filled':''}" onclick="toggleExStress('physical',${i})">${i+1}</div>`;}
    h+=`</div></div><div><span style="font-size:11px;font-weight:700;color:var(--muted)">Mental</span><div style="display:flex;gap:6px;margin-top:3px">`;
    for(let i=0;i<stressMax;i++){h+=`<div class="stress-box ${ex.stress?.mental?.[i]?'filled':''}" onclick="toggleExStress('mental',${i})">${i+1}</div>`;}
    h+=`</div></div>`;
    // Consequences
    h+=`<div class="divider"></div><div class="label mb-1">Team Consequences <span class="text-muted" style="font-weight:400">(no Extreme)</span></div>`;
    h+=`<div class="conseq-row"><div class="conseq-label">Mild (2)</div><div class="conseq-input"><input value="${esc(ex.consequences?.mild||'')}" oninput="S.team.expanded.consequences.mild=this.value;save()" placeholder="\u2014"></div></div>`;
    h+=`<div class="conseq-row"><div class="conseq-label">Moderate (4)</div><div class="conseq-input"><input value="${esc(ex.consequences?.moderate||'')}" oninput="S.team.expanded.consequences.moderate=this.value;save()" placeholder="\u2014"></div></div>`;
    h+=`<div class="conseq-row"><div class="conseq-label">Severe (6)</div><div class="conseq-input"><input value="${esc(ex.consequences?.severe||'')}" oninput="S.team.expanded.consequences.severe=this.value;save()" placeholder="\u2014"></div></div>`;
    // Refresh / FP
    const exRefresh=tone?.refresh||5;
    h+=`<div class="divider"></div><div style="display:flex;align-items:center;justify-content:space-between"><div><div class="label">Team Fate Points</div><div style="font-size:10px;color:var(--muted)">Refresh: ${exRefresh}</div></div><div style="display:flex;align-items:center;gap:8px"><button class="sk-btn" onclick="S.team.expanded.fp=Math.max(0,(S.team.expanded.fp||${exRefresh})-1);save();renderNPCs()">−</button><span style="font-size:22px;font-weight:900;font-family:var(--font-title);color:var(--gold)">${ex.fp!==undefined?ex.fp:exRefresh}</span><button class="sk-btn" onclick="S.team.expanded.fp=(S.team.expanded.fp||${exRefresh})+1;save();renderNPCs()">+</button></div></div>`;
    h+=`</div>`;
  }
  h+=`<button class="btn btn-danger btn-full mt-2 edit-only" onclick="if(confirm('Disband?')){S.team=null;save();renderNPCs();}">Disband Team</button>`;el.innerHTML=h;
}
function addTR(){const n=prompt('Rogue Name:');if(!n)return;S.team.rogues.push({name:n,desc:prompt('Description:')||''});save();renderNPCs();}
function toggleTS(id){const t=S.team,i=t.stunts.indexOf(id);if(i>=0){t.stunts.splice(i,1);TEAM_STUNTS.filter(ts=>ts.requires===id).forEach(ts=>{const di=t.stunts.indexOf(ts.id);if(di>=0)t.stunts.splice(di,1);});}else t.stunts.push(id);save();renderNPCs();}
function toggleTC(id){const t=S.team,i=t.complications.indexOf(id);if(i>=0)t.complications.splice(i,1);else t.complications.push(id);save();renderNPCs();}
function initExpandedTeam(){
  const{tone}=getSeriesConfig();const stressMax=tone?2+tone.stressBonus:4;
  S.team.expanded={aspect1:'',aspect2:'',skills:{Combat:0,Expertise:0,Social:0,Undercover:0},stunts:[],powers:[],
    stress:{physical:Array(stressMax).fill(false),mental:Array(stressMax).fill(false)},
    consequences:{mild:'',moderate:'',severe:''},fp:tone?.refresh||5};
  save();renderNPCs();
}
function adjExSkill(sk,d){const ex=S.team.expanded,cur=ex.skills[sk]||0,nv=cur+d;if(nv<0||nv>3)return;
  const used=Object.values(ex.skills).reduce((s,v)=>s+v,0);if(d>0&&used>=3)return;
  ex.skills[sk]=nv;save();renderNPCs();}
function toggleExStress(track,i){const ex=S.team.expanded;if(!ex.stress[track])ex.stress[track]=[];ex.stress[track][i]=!ex.stress[track][i];save();renderNPCs();}
function addExStunt(){const n=prompt('Team Stunt Name:');if(!n)return;const d=prompt('Description:')||'';const c=Math.max(1,Math.min(3,parseInt(prompt('HP Cost (1-3):','1'))||1));S.team.expanded.stunts.push({name:n,desc:d,cost:c});save();renderNPCs();}
function addExPower(){const n=prompt('Power Name:');if(!n)return;const d=prompt('Description:')||'';const c=Math.max(1,Math.min(6,parseInt(prompt('HP Cost (1-6):','1'))||1));S.team.expanded.powers.push({name:n,desc:d,cost:c});save();renderNPCs();}

// Team-targeted Sample Stunts browser (mirrors the NPC stunt browser but pushes to team.expanded.stunts)
let _teamStuntBrowseOpen=false,_teamStuntSearch='',_teamStuntSkillFilter='';
function openTeamStuntBrowser(){_teamStuntBrowseOpen=true;_teamStuntSearch='';_teamStuntSkillFilter='';renderNPCs();}
function pickTeamStunt(name){const s=SAMPLE_STUNTS.find(x=>x.name===name);if(!s)return;if(!S.team.expanded.stunts)S.team.expanded.stunts=[];S.team.expanded.stunts.push({name:s.name,desc:s.desc,cost:s.cost});save();renderNPCs();}
function renderTeamStuntBrowser(){
  if(!_teamStuntBrowseOpen)return'';
  const q=_teamStuntSearch.toLowerCase(),sf=_teamStuntSkillFilter;
  const filtered=SAMPLE_STUNTS.filter(s=>{if(q&&!s.name.toLowerCase().includes(q)&&!s.desc.toLowerCase().includes(q))return false;if(sf&&s.skill!==sf)return false;return true;});
  const skillFilters=['All',...[...new Set(SAMPLE_STUNTS.map(s=>s.skill))].sort()];
  let h=`<div class="card" style="border-color:var(--accent)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label" style="margin:0">Sample Stunts</div><button class="btn btn-secondary btn-xs" onclick="_teamStuntBrowseOpen=false;renderNPCs()">Close</button></div>`;
  h+=`<input id="team-stunt-search" placeholder="Search stunts..." value="${esc(_teamStuntSearch)}" oninput="_teamStuntSearch=this.value;renderNPCs();_refocus('team-stunt-search')" style="margin-bottom:6px;font-size:12px;padding:7px">`;
  h+=`<div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px">${skillFilters.map(f=>`<button class="btn btn-xs ${(f==='All'&&!sf)||sf===f?'btn-primary':'btn-secondary'}" onclick="_teamStuntSkillFilter='${f==='All'?'':f}';renderNPCs()" style="font-size:10px;padding:3px 7px">${f}</button>`).join('')}</div>`;
  h+=`<div style="max-height:40vh;overflow-y:auto">`;
  const existing=(S.team.expanded.stunts||[]).map(s=>s.name);
  filtered.forEach(s=>{const have=existing.includes(s.name);h+=`<div class="card-sm" style="display:flex;gap:8px;align-items:start;${have?'opacity:.5':''}"><div style="flex:1"><div class="fw-700" style="font-size:12px">${esc(s.name)} <span class="text-muted" style="font-weight:400;font-size:10px">[${s.skill}]</span></div><div style="font-size:11px;color:var(--muted)">${esc(s.desc)}</div></div>${have?'<span class="text-green" style="font-size:10px">✓</span>':`<button class="btn btn-primary btn-xs" onclick="pickTeamStunt('${esc(s.name)}')">Add</button>`}</div>`;});
  if(!filtered.length)h+='<div class="tac text-muted" style="padding:12px">No matches</div>';
  h+=`</div></div>`;
  return h;
}

let _npcTab='supporting',_npcEdit=null,_npcFullMode=false;
const NPC_TABS=[{id:'supporting',label:'Cast'},{id:'rogue',label:'Rogues'},{id:'nameless',label:'Nameless'},{id:'main',label:'Main'},{id:'team',label:'Team'}];
const NPC_TYPE_LABELS={supporting:'Cast Member',rogue:'Rogue',nameless:'Nameless',main:'Main NPC'};
const NPC_SKILL_HINTS={supporting:'Supporting cast usually need 1-3 skills at Average(+1) to Good(+3) — enough to be useful in a scene.',rogue:'Rogues need 3-6 skills at Good(+3) to Fantastic(+6).',nameless:'Nameless goons rarely need more than 1-2 skills. The Obstacle rating usually does the work.',main:'Main NPCs are built like heroes — 5-8 skills spanning the ladder.'};
// Expandable roster cards. Tap a card header to reveal the full stat block.
let _npcOpen={};
function npcKey(npc,ri){return npc.id||('idx'+ri);}
function toggleNPCCard(k){_npcOpen[k]=!_npcOpen[k];renderNPCs();}
function npcPowerSets(npc){return npc.forms?npc.forms.flatMap(f=>f.powerSets||[]):(npc.powerSets||[]);}
function npcCardHTML(npc,ri){
  const k=npcKey(npc,ri),open=!!_npcOpen[k];
  const ps=npcPowerSets(npc),pwCount=ps.reduce((n,p)=>n+(p.powers?.length||0),0),fc=npc.forms?.length||0;
  const skills=Object.entries(npc.skills||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const stressUsed=(npc.stress||[]).filter(Boolean).length;
  let h=`<div class="npc-card ${open?'open':''}">`;

  // ── Header (always visible) ──
  h+=`<div class="npc-card-head" onclick="toggleNPCCard('${esc(k)}')">`;
  h+=`<div class="npc-card-main"><div class="npc-card-name">${esc(npc.name)}</div>`;
  if(npc.desc)h+=`<div class="npc-card-desc">${esc(npc.desc)}</div>`;
  h+=`<div class="npc-card-chips">`;
  if(npc.fromHero)h+=`<span class="npc-chip hero">◆ Player Hero</span>`;
  if(npc.type==='nameless')h+=`<span class="npc-chip ob">Obstacle ${esc(npc.obstacle||'+0')}</span>`;
  if(skills.length)h+=`<span class="npc-chip">${skills.length} skill${skills.length>1?'s':''}</span>`;
  if(ps.length)h+=`<span class="npc-chip pw">⚡ ${pwCount} power${pwCount!==1?'s':''}</span>`;
  else if(npc.powers)h+=`<span class="npc-chip pw">⚡ Powers</span>`;
  if(fc>1)h+=`<span class="npc-chip pw">${fc} forms</span>`;
  if(npc.stunts?.length)h+=`<span class="npc-chip st">★ ${npc.stunts.length} stunt${npc.stunts.length>1?'s':''}</span>`;
  if(npc.stress?.length)h+=`<span class="npc-chip"${stressUsed?' style="color:var(--accent);border-color:var(--accent)"':''}>Stress ${stressUsed}/${npc.stress.length}</span>`;
  h+=`</div></div><div class="npc-caret">▶</div></div>`;

  if(!open)return h+`</div>`;

  // ── Expanded body ──
  h+=`<div class="npc-card-body">`;
  if(npc.desc)h+=`<div class="npc-sec" style="font-size:12px;color:var(--muted);white-space:pre-wrap">${esc(npc.desc)}</div>`;
  if(npc.aspects?.length)h+=`<div class="npc-sec"><div class="npc-sec-lab">Aspects</div>${npc.aspects.filter(Boolean).map(a=>`<span class="tag" style="background:var(--surface3);color:var(--text);border:1px solid var(--border)">${esc(a)}</span>`).join(' ')}</div>`;
  if(skills.length)h+=`<div class="npc-sec"><div class="npc-sec-lab">Skills</div>${skills.map(([n,v])=>`<span class="npc-chip" style="color:var(--text)">${esc(n)} +${v}</span>`).join(' ')}</div>`;
  else if(npc.skillText)h+=`<div class="npc-sec"><div class="npc-sec-lab">Skills</div><div style="font-size:12px;color:var(--muted)">${esc(npc.skillText)}</div></div>`;

  if(ps.length){
    h+=`<div class="npc-sec"><div class="npc-sec-lab">Powers</div>`;
    (npc.forms||[{name:'',powerSets:npc.powerSets||[]}]).forEach(f=>{
      if(fc>1&&f.name)h+=`<div style="font-family:var(--font-label);font-size:11px;font-weight:700;color:var(--muted);margin:6px 0 3px">${esc(f.name)}</div>`;
      (f.powerSets||[]).forEach(p=>{
        h+=`<div class="card-sm" style="border-color:var(--purple)"><div class="fw-700" style="font-size:13px;color:var(--purple)">${esc(p.name||'Power Set')}</div>`;
        if(p.aspect)h+=`<div style="font-size:11px;font-style:italic;color:var(--muted)">${esc(p.aspect)}</div>`;
        (p.powers||[]).forEach(pw=>{const pd=POWERS.find(x=>x.id===pw.powerId);
          h+=`<div style="font-size:12px;margin-top:4px"><span class="fw-700">${powerIco(pw)}${esc(pw.customName||pd?.name||pw.powerId)}</span>${pw.level>1?` <span class="text-accent">Lv${pw.level}</span>`:''}`;
          if(pd?.desc)h+=`<div style="font-size:11px;color:var(--muted)">${esc(pd.desc)}</div>`;
          if(pw.selectedSE?.length)h+=`<div>${pw.selectedSE.map(se=>`<span class="tag tag-se">${esc(se)}</span>`).join(' ')}</div>`;
          if(pw.selectedLim?.length)h+=`<div>${pw.selectedLim.map(l=>`<span class="tag tag-lim">${esc(l)}</span>`).join(' ')}</div>`;
          h+=`</div>`;});
        h+=`</div>`;
      });
    });
    h+=`</div>`;
  } else if(npc.powers){
    h+=`<div class="npc-sec"><div class="npc-sec-lab">Powers</div><div style="font-size:12px;color:var(--purple)">${esc(npc.powers)}</div></div>`;
  }

  if(npc.stunts?.length){
    h+=`<div class="npc-sec"><div class="npc-sec-lab">Stunts</div>`;
    npc.stunts.forEach(st=>{h+=`<div class="card-sm"><div class="fw-700" style="font-size:12px">${esc(st.name)}</div>${st.desc?`<div style="font-size:11px;color:var(--muted)">${esc(st.desc)}</div>`:''}</div>`;});
    h+=`</div>`;
  }

  if(npc.stress?.length){
    h+=`<div class="npc-sec"><div class="npc-sec-lab">Stress</div><div style="display:flex;gap:4px;flex-wrap:wrap">`;
    npc.stress.forEach((v,si)=>{h+=`<div class="stress-box ${v?'filled':''}" style="width:24px;height:24px;font-size:10px" onclick="S.npcs[${ri}].stress[${si}]=!S.npcs[${ri}].stress[${si}];save();renderNPCs()">${si+1}</div>`;});
    h+=`</div></div>`;
  }

  const cq=npc.consequences||{};
  if(cq.mild||cq.moderate||cq.severe){
    h+=`<div class="npc-sec"><div class="npc-sec-lab">Consequences</div>`;
    [['Mild',cq.mild],['Moderate',cq.moderate],['Severe',cq.severe]].forEach(([lab,v])=>{if(v)h+=`<div style="font-size:12px"><span class="text-muted">${lab}:</span> ${esc(v)}</div>`;});
    h+=`</div>`;
  }
  if(typeof npc.gear==='string'&&npc.gear.trim())h+=`<div class="npc-sec"><div class="npc-sec-lab">Gear & Notes</div><div style="font-size:12px;color:var(--muted);white-space:pre-wrap">${esc(npc.gear)}</div></div>`;

  h+=`<div class="npc-card-acts edit-only">`;
  if(npc.fromHero){h+=`<button class="btn btn-secondary btn-xs" onclick="exportNPCToSlot(${ri})" title="Copy into a save slot to play">→ Slot</button>`;}
  else{
    h+=`<button class="btn btn-gold btn-xs" onclick="openFullNPCBuilder(${ri})">Builder</button>`;
    if(npc.type==='main'||npc.type==='rogue')h+=`<button class="btn btn-secondary btn-xs" onclick="exportNPCToSlot(${ri})" title="Save this NPC as a playable character in a save slot">→ Slot</button>`;
    h+=`<button class="btn btn-secondary btn-xs" onclick="editNPC(${ri})">Edit</button><button class="btn btn-danger btn-xs" onclick="if(confirm('Delete?')){S.npcs.splice(${ri},1);save();renderNPCs();}">X</button>`;
  }
  h+=`</div></div></div>`;
  return h;
}
function renderNPCs(){
  const el=document.getElementById('npcs-content');
  if(_npcFullMode){renderFullNPCEditor();return;}
  let h=universeBarHTML()+`<div class="${_npcEditMode?'':'no-edit'}">`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:start;gap:8px;flex-wrap:wrap;margin-bottom:4px"><div><div class="pg-title">NPCs</div><div class="pg-sub">Characters, Villains & Team</div></div>${editToggleBtn(_npcEditMode,'toggleNPCEdit')}</div>`;
  if(!_npcEditMode)h+=noEditBanner();
  h+=`<div class="npc-tabs">${NPC_TABS.map(t=>`<div class="npc-tab ${_npcTab===t.id?'active':''}" onclick="_npcTab='${t.id}';renderNPCs()">${t.label}</div>`).join('')}</div>`;
  if(_npcTab==='team'){let teamH='';renderTeamInner({set innerHTML(v){teamH=v;}});h+=teamH+'</div>';el.innerHTML=h;return;}
  const _list=S.npcs.filter(n=>n.type===_npcTab && !(n.fromHero&&S.char&&n.heroId===S.char.heroId));
  h+=`<div class="npc-grid">`;
  _list.forEach(npc=>{h+=npcCardHTML(npc,S.npcs.indexOf(npc));});
  if(!_list.length)h+=`<div class="tac text-muted" style="grid-column:1/-1;padding:20px 10px;font-size:12px">No ${esc((NPC_TABS.find(t=>t.id===_npcTab)||{}).label||'entries')} yet.</div>`;
  h+=`</div>`;
  h+=`<div class="edit-only" style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-primary" style="flex:1" onclick="openAddNPC()">+ Quick Add</button>`;
  h+=`<button class="btn btn-gold" style="flex:1" onclick="openFullNPCBuilder(null)">+ Full Builder</button>`;
  h+=`</div><div class="edit-only" style="font-size:10px;color:var(--muted);margin-top:4px;text-align:center">Quick Add = name, blurb & stress. Full Builder = aspects, skills, powers, stunts & consequences.</div></div>`;
  el.innerHTML=h;
}
function openAddNPC(){_npcEdit=null;renderNM();document.getElementById('npc-modal').classList.add('open');}
function editNPC(i){_npcEdit=i;renderNM();document.getElementById('npc-modal').classList.add('open');}
function closeNM(){document.getElementById('npc-modal').classList.remove('open');}
function renderNM(){
  const npc=_npcEdit!==null?S.npcs[_npcEdit]:null,type=npc?.type||_npcTab;
  let h=`<h2 style="font-family:var(--font-title);font-size:20px;margin-bottom:12px">${npc?'Edit':'Add'} NPC</h2><div class="form-group"><label>Name</label><input id="nm-name" value="${esc(npc?.name||'')}"></div><div class="form-group"><label>Description</label><textarea id="nm-desc">${esc(npc?.desc||'')}</textarea></div>`;

function saveNPC(){
  const type=_npcEdit!==null?S.npcs[_npcEdit].type:_npcTab,name=document.getElementById('nm-name').value.trim();if(!name)return alert('Name required');
  const existing=_npcEdit!==null?S.npcs[_npcEdit]:{};
  const npc={...existing,type,name,desc:document.getElementById('nm-desc').value};
  if(type==='main'||type==='rogue'){npc.aspects=(document.getElementById('nm-asp')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);npc.skillText=document.getElementById('nm-sk')?.value||'';npc.powers=document.getElementById('nm-pw')?.value||'';npc.stress=Array(parseInt(document.getElementById('nm-st')?.value)||4).fill(false);if(!npc.consequences)npc.consequences={mild:'',moderate:'',severe:''};}
  if(type==='nameless'){npc.obstacle=document.getElementById('nm-ob')?.value||'+2';npc.stress=Array(parseInt(document.getElementById('nm-st')?.value)||2).fill(false);}
  if(type==='supporting'){npc.skills=npc.skills||{};npc.aspects=npc.aspects||[];}
  ensureId(npc);if(_npcEdit!==null)S.npcs[_npcEdit]=npc;else S.npcs.push(npc);save();closeNM();renderNPCs();
}

// ─── Full NPC Builder ─────────────────────────────────────
function promoteToFullBuilder(idx){
  const n=document.getElementById('nm-name')?.value||'',ds=document.getElementById('nm-desc')?.value||'';
  closeNM();openFullNPCBuilder(idx);
  if(idx===null&&S._npcDraft){if(n.trim())S._npcDraft.name=n.trim();if(ds.trim())S._npcDraft.desc=ds.trim();renderFullNPCEditor();}
}
function openFullNPCBuilder(idx){
  _npcEdit=idx;
  _npcFullMode=true;
  if(idx===null)_npcEditMode=true;
  const existing=idx!==null?S.npcs[idx]:null;
  // Migrate legacy powerSets into forms structure
  const forms = existing?.forms ? JSON.parse(JSON.stringify(existing.forms))
    : [{name:'Main Form', powerSets: existing?.powerSets ? JSON.parse(JSON.stringify(existing.powerSets)) : []}];
  const draftSkills = existing?.skills ? JSON.parse(JSON.stringify(existing.skills)) : {};
  migrateControllingSkill(draftSkills);
  const _dtype=existing?.type||(_npcTab==='team'?'supporting':_npcTab);
  const _defStress=_dtype==='nameless'?2:(_dtype==='supporting'?3:4);
  S._npcDraft={
    type:_dtype,
    obstacle:existing?.obstacle||'+2',
    name:existing?.name||'',
    desc:existing?.desc||'',
    aspects:existing?.aspects||[],
    skills:draftSkills,
    forms,
    activeForm: existing?.activeForm||0,
    stunts:existing?.stunts?JSON.parse(JSON.stringify(existing.stunts)):[],
    stress:existing?.stress||Array(_defStress).fill(false),
    consequences:existing?.consequences||{mild:'',moderate:'',severe:''},
    gear:existing?.gear||''
  };
  renderFullNPCEditor();
}
function closeFullNPCBuilder(){_npcFullMode=false;S._npcDraft=null;renderNPCs();}
function saveFullNPC(){
  const d=S._npcDraft;if(!d.name.trim())return alert('Name required');
  // Keep legacy fields for backwards-compat display
  d.skillText=Object.entries(d.skills||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`${n} +${v}`).join(', ');
  d.powers=(d.forms||[]).flatMap(f=>(f.powerSets||[]).flatMap(ps=>(ps.powers||[]).map(pw=>pw.customName||POWERS.find(p=>p.id===pw.powerId)?.name||pw.powerId))).join(', ');
  delete d.powerSets; // forms supersedes legacy powerSets
  if(d.type!=='nameless')delete d.obstacle;
  ensureId(d);if(_npcEdit!==null)S.npcs[_npcEdit]=d;else S.npcs.push(d);
  save();closeFullNPCBuilder();
}

function changeNPCDraftType(t){if(!S._npcDraft||!NPC_TYPE_LABELS[t])return;S._npcDraft.type=t;if(t==='nameless'&&!S._npcDraft.obstacle)S._npcDraft.obstacle='+2';_npcTab=t;save();renderFullNPCEditor();}
function adjNPCSkill(sk,d){const n=S._npcDraft;const cur=n.skills[sk]||0,nv=cur+d;if(nv<0||nv>6)return;n.skills[sk]=nv;if(!nv)delete n.skills[sk];save();renderFullNPCEditor();}
let _npcStuntBrowseOpen=false,_npcStuntSearch='',_npcStuntSkillFilter='';
function openNPCStuntBrowser(){_npcStuntBrowseOpen=true;_npcStuntSearch='';_npcStuntSkillFilter='';renderFullNPCEditor();}
function renderNPCStuntBrowser(){

function pickNPCStunt(name){const s=SAMPLE_STUNTS.find(x=>x.name===name);if(!s)return;S._npcDraft.stunts=S._npcDraft.stunts||[];S._npcDraft.stunts.push({name:s.name,desc:s.desc,cost:s.cost});save();renderFullNPCEditor();}

  // Update sidebar
  const ssk=document.getElementById('ds-sk');if(ssk)ssk.value=skill;
  const smod=document.getElementById('ds-mod');if(smod)smod.value=_loadedMod;
  updateLoadedInfo('s');
}
function updateLoadedInfo(target){
  const sk=target==='s'?document.getElementById('ds-sk')?.value:document.getElementById('dm-sk')?.value;
  const sv=S.char?.skills?.[sk]||0;
  const mod=parseInt((target==='s'?document.getElementById('ds-mod'):document.getElementById('dm-mod'))?.value)||0;
  const label=_loadedPower||sk||'';
  const el=document.getElementById(target==='s'?'ds-loaded':'dm-loaded-info');
  const el2=document.getElementById('dm-loaded');
  if(el&&target==='m')el.innerHTML=label?`<div style="font-size:12px;color:var(--purple);font-weight:700;font-family:var(--font-title)">${esc(label)}</div>`:'';
  if(el2)el2.textContent=label?' \u2022 '+label:'';
}
function fateOutcome(shifts){
  if(shifts<0)return{label:'FAIL',color:'var(--red)',desc:'You don\u2019t achieve your goal.'};
  if(shifts===0)return{label:'TIE',color:'var(--yellow)',desc:'Success at a minor cost.'};
  if(shifts<=2)return{label:'SUCCESS',color:'var(--green)',desc:shifts+' shift'+(shifts>1?'s':'')+'.'};
  return{label:'SUCCESS WITH STYLE',color:'var(--cyan)',desc:shifts+' shifts! Gain a Boost.'};
}
function renderRollResult(d,tn,target){
  const dh=d.dice.map(v=>`<span class="fate-die ${v>0?'plus':v<0?'minus':'blank'}" style="width:${target==='s'?'36':'32'}px;height:${target==='s'?'36':'32'}px;font-size:${target==='s'?'20':'18'}px;border-radius:${target==='s'?'8':'6'}px">${v>0?'+':v<0?'\u2212':'0'}</span>`).join('');
  const shifts=d.total-tn;
  const out=fateOutcome(shifts);
  const pn=d.powerName?`<div style="font-size:14px;font-weight:900;font-family:var(--font-title);color:var(--purple);margin-bottom:2px">${d.powerName}</div>`:'';
  return`<div style="text-align:center"><div style="display:flex;gap:${target==='s'?'6':'8'}px;justify-content:center;margin-bottom:6px">${dh}</div>${pn}<div style="font-size:10px;color:var(--muted)">${d.skill?d.skill+' (+'+d.skillVal+')':'Flat roll'}${d.mod?' + bonus(+'+d.mod+')':''}${tn?' vs TN '+tn:''}</div><div style="font-size:22px;font-weight:900;font-family:var(--font-title);color:var(--accent);margin:2px 0">${d.total>=0?'+':''}${d.total} ${ladderName(d.total)}</div>${tn!==0||tn===0?`<div style="font-size:16px;font-weight:900;color:${out.color};margin:2px 0">${out.label}</div><div style="font-size:11px;color:var(--muted)">${out.desc}</div>`:''}<div style="margin-top:6px"><button class="btn btn-gold btn-xs" onclick="if(S.char&&S.char.fatePoints>0){S.char.fatePoints--;S.dice.total+=2;save();refreshRollResult('${target}');}else alert('No FP!')">Invoke +2</button> <button class="btn btn-secondary btn-xs" onclick="if(S.char&&S.char.fatePoints>0){S.char.fatePoints--;S.dice.dice=[rollFD(),rollFD(),rollFD(),rollFD()];S.dice.diceSum=S.dice.dice.reduce((a,b)=>a+b,0);S.dice.total=S.dice.diceSum+S.dice.skillVal+S.dice.mod;save();refreshRollResult('${target}');}else alert('No FP!')">Reroll</button>${target==='m'?' <button class="btn btn-xs btn-secondary" onclick="clearRollToast()">Dismiss</button>':''}</div></div>`;
}
function refreshRollResult(target){
  const d=S.dice;if(!d)return;
  const tn=d.tn||0;
  if(target==='s'){const el=document.getElementById('ds-result');if(el)el.innerHTML=renderRollResult(d,tn,'s');renderSheet();}
  else{const toast=document.getElementById('quick-roll-toast');if(toast)toast.innerHTML=`<div class="card" style="border-color:var(--accent);animation:fadeIn .15s ease">${renderRollResult(d,tn,'m')}</div>`;}
}
function doSidebarRoll(){
  const sk=document.getElementById('ds-sk')?.value||'';
  const mod=parseInt(document.getElementById('ds-mod')?.value)||0;
  const tn=parseInt(document.getElementById('ds-tn')?.value)||0;
  const sv=getSkillVal(sk);
  const dice=[rollFD(),rollFD(),rollFD(),rollFD()];
  const ds=dice.reduce((a,b)=>a+b,0);
  const tot=ds+sv+mod;
  S.dice={skill:getSkillLabel(sk),skillVal:sv,mod,dice,diceSum:ds,total:tot,powerName:_loadedPower,tn};
  save();
  const el=document.getElementById('ds-result');if(el)el.innerHTML=renderRollResult(S.dice,tn,'s');
}
function doMobileRoll(){
  const sk=document.getElementById('dm-sk')?.value||'';
  const mod=parseInt(document.getElementById('dm-mod')?.value)||0;
  const tn=parseInt(document.getElementById('dm-tn')?.value)||0;
  const sv=S.char?.skills?.[sk]||0;
  const dice=[rollFD(),rollFD(),rollFD(),rollFD()];
  const ds=dice.reduce((a,b)=>a+b,0);
  const tot=ds+sv+mod;
  S.dice={skill:sk,skillVal:sv,mod,dice,diceSum:ds,total:tot,powerName:_loadedPower,tn};
  save();
  const toast=document.getElementById('quick-roll-toast');
  if(toast){toast.innerHTML=`<div class="card" style="border-color:var(--accent);animation:fadeIn .15s ease">${renderRollResult(S.dice,tn,'m')}</div>`;toast.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function updateDSP(){}
function getSkillVal(sk){if(sk.startsWith('team:')){const tsk=sk.substring(5);return S.team?.expanded?.skills?.[tsk]||0;}return S.char?.skills?.[sk]||0;}
function getSkillLabel(sk){return sk.startsWith('team:')?sk.substring(5):sk;}
function updateDP(){const sk=document.getElementById('d-sk')?.value,mod=parseInt(document.getElementById('d-mod')?.value)||0,sv=getSkillVal(sk||'');const el=document.getElementById('d-preview');if(el)el.textContent=sk?`4dF + ${getSkillLabel(sk)}(+${sv})${mod?' + '+(mod>0?'+':'')+mod:''}`:'4dF';}
function rollFD(){return[-1,0,1][Math.floor(Math.random()*3)];}
function doRoll(){const sk=document.getElementById('d-sk')?.value||'',mod=parseInt(document.getElementById('d-mod')?.value)||0,sv=getSkillVal(sk),dice=[rollFD(),rollFD(),rollFD(),rollFD()],ds=dice.reduce((a,b)=>a+b,0),tot=ds+sv+mod;S.dice={skill:getSkillLabel(sk),skillVal:sv,mod,dice,diceSum:ds,total:tot};save();renderDR();}
function renderDR(){
  const area=document.getElementById('d-result'),act=document.getElementById('d-actions');if(!area)return;const d=S.dice;
  if(!d||!d.dice){area.innerHTML='';if(act)act.style.display='none';return;}
  const dh=d.dice.map(v=>`<div class="fate-die ${v>0?'plus':v<0?'minus':'blank'}">${v>0?'+':v<0?'\u2212':'0'}</div>`).join('');
  area.innerHTML=`<div class="card tac"><div style="display:flex;gap:10px;justify-content:center;margin-bottom:10px">${dh}</div><div style="font-size:12px;color:var(--muted)">Dice: ${d.diceSum>=0?'+':''}${d.diceSum}${d.skill?' | '+d.skill+': +'+d.skillVal:''}${d.mod?' | Mod: '+(d.mod>=0?'+':'')+d.mod:''}</div><div style="font-size:32px;font-weight:900;font-family:var(--font-title);color:var(--accent);margin:4px 0">${d.total>=0?'+':''}${d.total}</div><div style="font-size:16px;font-weight:700">${ladderName(d.total)}</div></div>`;
  if(act)act.style.display=S.char?'block':'none';
}
function invokeAsp(){if(!S.char||S.char.fatePoints<=0)return alert('No Fate Points!');S.char.fatePoints--;S.dice.total+=2;save();renderDR();renderDice();}
function rerollDice(){if(!S.char||S.char.fatePoints<=0)return alert('No Fate Points!');S.char.fatePoints--;S.dice.dice=[rollFD(),rollFD(),rollFD(),rollFD()];S.dice.diceSum=S.dice.dice.reduce((a,b)=>a+b,0);S.dice.total=S.dice.diceSum+S.dice.skillVal+S.dice.mod;save();renderDR();}
function compelAsp(){if(!S.char)return;S.char.fatePoints++;save();renderDice();}

function renderConflict(){
  const el=document.getElementById('conflict-content'),c=S.conflict;
  let h=`<div class="pg-title">Conflict</div><div class="pg-sub">Zone-based combat tracker</div>`;
  if(!c.active){h+=`<div class="tac" style="padding:30px"><div style="font-size:36px;margin-bottom:8px">\u2694</div><div class="text-muted mb-3">No active conflict</div><button class="btn btn-primary" onclick="startConflict()">Start Conflict</button></div>`;}
  else{
    h+=`<div class="card-sm" style="display:flex;justify-content:space-between;align-items:center"><div><span class="label">Round</span> <span class="fw-700 text-accent" style="font-size:20px">${c.round}</span></div><div style="display:flex;gap:4px"><button class="btn btn-secondary btn-xs" onclick="nextRound()">Next Round</button><button class="btn btn-danger btn-xs" onclick="endConflict()">End</button></div></div>`;
    h+=`<div class="card"><div class="label mb-1">Turn Order</div>`;
    c.turnOrder.forEach((t,i)=>{h+=`<div class="combatant ${i===c.currentTurn?'current':''}"><div style="width:20px;font-size:12px;font-weight:700;color:${i===c.currentTurn?'var(--accent)':'var(--muted)'}">${i+1}</div><div style="flex:1;font-weight:600;font-size:13px">${esc(t.name)}</div><span style="font-size:11px;color:var(--muted)">${t.type}</span><button class="btn btn-danger btn-xs" onclick="S.conflict.turnOrder.splice(${i},1);if(S.conflict.currentTurn>=${i}&&S.conflict.currentTurn>0)S.conflict.currentTurn--;save();renderConflict()" style="padding:2px 6px">X</button></div>`;});
    h+=`<div style="display:flex;gap:4px;margin-top:6px"><input id="ct-name" placeholder="Name" style="flex:1;font-size:12px;padding:6px"><select id="ct-type" style="width:80px;font-size:12px;padding:6px"><option>Hero</option><option>NPC</option><option>Villain</option><option>Team</option></select><button class="btn btn-secondary btn-xs" onclick="addCombat()">Add</button></div>`;
    if(S.team?.expanded&&!c.turnOrder.some(t=>t.type==='Team')){h+=`<button class="btn btn-gold btn-xs btn-full mt-1" onclick="addTeamToConflict()">+ Add ${esc(S.team.name)}</button>`;}
    h+=`<button class="btn btn-primary btn-sm btn-full mt-2" onclick="nextTurn()">Next Turn \u2192</button></div>`;
    h+=`<div class="card"><div class="label mb-1">Zones</div>`;
    c.zones.forEach((z,i)=>{h+=`<div class="zone-card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="zone-name">${esc(z.name)}</div><button class="btn btn-danger btn-xs" onclick="S.conflict.zones.splice(${i},1);save();renderConflict()">X</button></div>${z.aspects?`<div style="font-size:11px;color:var(--muted);font-style:italic">${esc(z.aspects)}</div>`:''}<div style="font-size:11px;margin-top:4px">${(z.occupants||[]).map(o=>`<span class="tag" style="background:var(--surface3);color:var(--text);border:1px solid var(--border)">${esc(o)}</span>`).join(' ')}</div><div style="display:flex;gap:4px;margin-top:4px"><input id="za-${i}" placeholder="Add occupant" style="flex:1;font-size:11px;padding:4px"><button class="btn btn-secondary btn-xs" onclick="addToZone(${i})">+</button></div></div>`;});
    h+=`<div style="display:flex;gap:4px"><input id="zn-name" placeholder="New zone" style="flex:1;font-size:12px;padding:6px"><button class="btn btn-secondary btn-xs" onclick="addZone()">+ Zone</button></div></div>`;
    if(c.log.length){h+=`<div class="card"><div class="label mb-1">Log</div>`;c.log.slice(-8).reverse().forEach(e=>{h+=`<div style="font-size:11px;color:var(--muted);padding:2px 0">${esc(e)}</div>`;});h+='</div>';}
  }
  el.innerHTML=h;
}
function startConflict(){S.conflict={active:true,zones:[{name:'Zone 1',aspects:'',occupants:[]}],turnOrder:[],currentTurn:0,round:1,log:['Conflict started']};if(S.char)S.conflict.turnOrder.push({name:S.char.costumedName,type:'Hero'});if(S.team?.expanded)S.conflict.turnOrder.push({name:S.team.name+' (Team)',type:'Team'});save();renderConflict();}
function endConflict(){if(confirm('End conflict?')){S.conflict={active:false,zones:[],turnOrder:[],currentTurn:0,round:1,log:[]};save();renderConflict();}}
function nextTurn(){const c=S.conflict;c.currentTurn=(c.currentTurn+1)%Math.max(1,c.turnOrder.length);c.log.push('Turn: '+(c.turnOrder[c.currentTurn]?.name||'?'));save();renderConflict();}
function nextRound(){S.conflict.round++;S.conflict.currentTurn=0;S.conflict.log.push('--- Round '+S.conflict.round+' ---');save();renderConflict();}
function addCombat(){const n=document.getElementById('ct-name').value.trim(),t=document.getElementById('ct-type').value;if(!n)return;S.conflict.turnOrder.push({name:n,type:t});S.conflict.log.push(n+' joined');save();renderConflict();}
function addZone(){const n=document.getElementById('zn-name').value.trim()||('Zone '+(S.conflict.zones.length+1));S.conflict.zones.push({name:n,aspects:'',occupants:[]});save();renderConflict();}
function addToZone(i){const inp=document.getElementById('za-'+i),n=inp?.value?.trim();if(!n)return;S.conflict.zones[i].occupants.push(n);save();renderConflict();}

window._logNewest=true;window._logReorder=false;window._logDragSrc=null;

function parseIssues(log){const g=[];let cur={label:'Campaign Log',entries:[]};log.forEach(e=>{if(e.type==='issue_break'){g.push(cur);cur={label:e.title||'Issue',entries:[]};}else cur.entries.push(e);});g.push(cur);return g.filter(g=>g.label==='Campaign Log'?g.entries.length>0:true);}

function renderNotes(){
  const el=document.getElementById('notes-content');if(!el)return;
  const nf=window._logNewest,reorder=window._logReorder,entries=S.notes||[];
  let h='';
  // Header
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px"><div class="pg-title">Journal</div><div style="display:flex;gap:4px;flex-wrap:wrap">`;
  if(!reorder){
    h+=`<button class="btn btn-xs btn-gold" onclick="addIssueBreak()">\u25b6 NEW ISSUE</button>`;
    h+=`<button class="btn btn-xs btn-secondary" onclick="exportLog()">\u2197 Export</button>`;
    h+=`<button class="btn btn-xs btn-secondary" onclick="window._logNewest=!window._logNewest;renderNotes()">${nf?'\u2193 Newest':'\u2191 Oldest'}</button>`;
  }
  h+=`<button class="btn btn-xs ${reorder?'btn-primary':'btn-secondary'}" onclick="window._logReorder=!window._logReorder;renderNotes()">${reorder?'\u2713 Done':'\u2982 Reorder'}</button>`;
  h+=`</div></div>`;

  if(!entries.length){
    h+=`<div class="tac" style="padding:40px"><div style="font-size:36px;margin-bottom:8px">\ud83d\udcd6</div><div class="text-muted">No entries yet. Start a new Issue or add an entry.</div></div>`;
  } else {
    const ordered=(nf&&!reorder)?[...entries].map((n,i)=>({n,i})).reverse():entries.map((n,i)=>({n,i}));
    ordered.forEach(({n:entry,i})=>{
      const drag=reorder?` draggable="true" ondragstart="logDS(event,${i})" ondragover="logDO(event)" ondragleave="logDL(event)" ondrop="logDD(event,${i})"`:' ';
      if(entry.type==='issue_break'){
        h+=`<div class="log-episode"${drag}>${reorder?'<span class="log-grip">\u2982</span>':''}<div class="log-episode-label">${esc(entry.title||'Issue')}</div>${!reorder?`<button class="btn btn-xs btn-secondary" onclick="editIssue(${i})" style="padding:2px 6px">\u270e</button><button class="btn btn-xs btn-danger" onclick="deleteLogEntry(${i})" style="padding:2px 6px">\u2715</button>`:''}</div>`;
        return;
      }
      const ti=LOG_TYPES.find(t=>t.key===entry.type)||LOG_TYPES[0];
      const emoji=entry.emoji||ti.emoji;
      const isMajor=entry.type==='main',isAlert=entry.type==='battle',isSupp=entry.type==='supplemental';
      const cls=isMajor?'log-major':isAlert?'log-alert':isSupp?'log-supplemental':'log-base';
      h+=`<div class="${cls}"${drag}${reorder?' style="cursor:grab"':''}>
        <div style="display:flex;align-items:flex-start;gap:8px">
          ${reorder?'<span class="log-grip" style="margin-top:2px">\u2982</span>':''}
          <span style="font-size:${isMajor?'20':'16'}px">${emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:${isMajor?'14':'12'}px;font-weight:700;color:${isMajor?'var(--accent)':isAlert?'var(--red)':isSupp?'var(--blue)':'var(--text)'}">${esc(entry.title||ti.label)}</div>
            <div style="font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:1px">${ti.label} \u00b7 ${entry.date||''}</div>
          </div>
          ${!reorder?`<button class="btn btn-xs btn-secondary" onclick="editLogEntry(${i})" style="padding:2px 6px">\u270e</button><button class="btn btn-xs btn-danger" onclick="deleteLogEntry(${i})" style="padding:2px 6px">\u2715</button>`:''}
        </div>
        ${entry.body?`<div style="font-size:${isMajor?'13':'12'}px;color:var(--text);line-height:1.6;margin-top:6px;white-space:pre-wrap">${esc(entry.body)}</div>`:''}
      </div>`;
    });
  }
  // FAB
  if(!reorder)h+=`<div style="position:fixed;bottom:80px;right:20px;z-index:50"><button class="roll-btn" style="width:52px;height:52px;font-size:28px" onclick="showAddEntry()">+</button></div>`;
  el.innerHTML=h;
}

// Issue breaks
function addIssueBreak(){
  const n=S.notes.filter(e=>e.type==='issue_break').length+1;
  const val=prompt('Issue label:','Issue '+n);if(!val||!val.trim())return;
  S.notes.push({type:'issue_break',title:val.trim()});
  save();renderNotes();showAddEntry();
}
function editIssue(i){const e=S.notes[i];if(!e)return;const v=prompt('Issue label:',e.title||'Issue');if(v&&v.trim()){e.title=v.trim();save();renderNotes();}}

// Add entry flow
function showAddEntry(){
  let h=`<div class="card"><div class="pg-title" style="font-size:18px;margin-bottom:8px">New Entry</div>`;
  h+=`<div class="label mb-2">Select type</div>`;
  // Primary
  const main=LOG_TYPES[0];
  h+=`<button class="btn btn-primary btn-full mb-2" onclick="showEntryForm('${main.key}')" style="padding:14px;font-size:14px">${main.emoji} ${main.label}</button>`;
  // Secondary
  const supp=LOG_TYPES[1];
  h+=`<button class="btn btn-secondary btn-full mb-2" onclick="showEntryForm('${supp.key}')">${supp.emoji} ${supp.label}</button>`;

  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;
  LOG_TYPES.slice(2).forEach(t=>{h+=`<button class="btn btn-secondary" onclick="showEntryForm('${t.key}')" style="padding:10px;font-size:12px">${t.emoji} ${t.label}</button>`;});

function showEntryForm(typeKey){
  const t=LOG_TYPES.find(l=>l.key===typeKey)||LOG_TYPES[0];
  let h=`<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn btn-secondary btn-xs" onclick="renderNotes()">\u2190 Back</button><span style="font-size:18px">${t.emoji}</span><span class="pg-title" style="font-size:16px;margin:0">${t.label}</span></div>`;
  h+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">${t.desc}</div>`;
  h+=`<div class="form-group"><label>Title</label><input id="log-title-in" placeholder="${esc(t.placeholder)}"></div>`;
  h+=`<div class="form-group"><label>Entry</label><textarea id="log-body-in" rows="6" placeholder="${esc(t.desc)}"></textarea></div>`;
  h+=`<input type="hidden" id="log-type-in" value="${t.key}"><input type="hidden" id="log-emoji-in" value="${t.emoji}">`;
  h+=`<div style="display:flex;gap:8px"><button class="btn btn-primary" style="flex:1" onclick="saveNewEntry()">Save Entry</button><button class="btn btn-secondary" onclick="renderNotes()">Cancel</button></div></div>`;
  document.getElementById('notes-content').innerHTML=h;
}

function saveNewEntry(){
  const type=document.getElementById('log-type-in').value;
  const emoji=document.getElementById('log-emoji-in').value;
  const title=document.getElementById('log-title-in').value.trim();
  const body=document.getElementById('log-body-in').value.trim();
  if(!title&&!body)return;
  const now=new Date();const date=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
  S.notes.push({type,emoji,title,body,date});
  save();renderNotes();
}

// Edit/delete
function editLogEntry(i){
  const entry=S.notes[i];if(!entry)return;
  const t=LOG_TYPES.find(l=>l.key===entry.type)||LOG_TYPES[0];
  let h=`<div class="card"><div class="pg-title" style="font-size:16px;margin-bottom:8px">\u270e Edit Entry</div>`;
  h+=`<div class="form-group"><label>Title</label><input id="log-title-in" value="${esc(entry.title||'')}" placeholder="${esc(t.placeholder)}"></div>`;
  h+=`<div class="form-group"><label>Entry</label><textarea id="log-body-in" rows="6">${esc(entry.body||'')}</textarea></div>`;
  h+=`<input type="hidden" id="log-edit-idx" value="${i}">`;
  h+=`<div style="display:flex;gap:8px"><button class="btn btn-primary" style="flex:1" onclick="saveEntryEdit()">Save</button><button class="btn btn-secondary" onclick="renderNotes()">Cancel</button></div></div>`;
  document.getElementById('notes-content').innerHTML=h;

function saveEntryEdit(){
  const i=parseInt(document.getElementById('log-edit-idx').value);
  const entry=S.notes[i];if(!entry)return;
  entry.title=document.getElementById('log-title-in').value.trim();
  entry.body=document.getElementById('log-body-in').value.trim();
  save();renderNotes();

function deleteLogEntry(i){if(!confirm('Delete this entry?'))return;S.notes.splice(i,1);save();renderNotes();}

// Drag reorder
function logDS(e,i){window._logDragSrc=i;e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='.4';}
