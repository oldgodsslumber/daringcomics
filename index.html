function buildHUD(){return`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daring Comics HUD</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0e1a;color:#f0f0f0;font-family:'Comic Neue',sans-serif;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.hc{background:#121828;border:1px solid #2a3a5a;border-radius:12px;padding:16px}.ht{font-family:'Bangers',cursive;font-size:28px;color:#e63946}.hl{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#7a8a9e;margin-bottom:4px}.sb{display:inline-flex;width:32px;height:32px;border:2px solid #2a3a5a;border-radius:6px;align-items:center;justify-content:center;margin:2px;font-size:14px;font-weight:700}.sb.f{background:#e63946;border-color:#e63946;color:#fff}.fd{display:inline-flex;width:56px;height:56px;border-radius:12px;align-items:center;justify-content:center;font-size:36px;font-weight:900;border:2px solid #2a3a5a;background:#1a2236;margin:4px}.fd.p{color:#2ecc71;border-color:#2ecc71}.fd.m{color:#e74c3c;border-color:#e74c3c}</style></head><body><div class="hc" id="hh" style="grid-column:span 2"><div class="ht" id="hn">Waiting...</div></div><div class="hc"><div class="hl">Stress & FP</div><div id="hs"></div></div><div class="hc"><div class="hl">Last Roll</div><div id="hd" style="text-align:center"></div></div><div class="hc"><div class="hl">Conflict</div><div id="hcf"></div></div><div class="hc"><div class="hl">Journal</div><div id="hn2"></div></div><script>const ch=new BroadcastChannel('daring-comics-hud');ch.postMessage({type:'ping'});ch.onmessage=function(e){const d=e.data;if(d.type!=='state')return;if(d.char){document.getElementById('hn').innerHTML=d.char.costumedName;let s='<div style="margin-top:8px"><div class="hl">Physical</div>';d.char.stress.physical.forEach(function(v,i){s+='<div class="sb'+(v?' f':'')+'\">'+(i+1)+'</div>';});s+='</div><div style="margin-top:8px"><div class="hl">Mental</div>';d.char.stress.mental.forEach(function(v,i){s+='<div class="sb'+(v?' f':'')+'\">'+(i+1)+'</div>';});s+='</div><div style="margin-top:12px;font-size:28px;font-weight:900;color:#f1c40f">FP: '+d.char.fatePoints+'</div>';document.getElementById('hs').innerHTML=s;}if(d.dice&&d.dice.dice){var dh=d.dice.dice.map(function(v){return'<div class="fd'+(v>0?' p':v<0?' m':'')+'\">'+(v>0?'+':v<0?'\\u2212':'0')+'</div>';}).join('');dh+='<div style="font-size:48px;font-weight:900;font-family:Bangers;color:#e63946;margin-top:8px">'+(d.dice.total>=0?'+':'')+d.dice.total+'</div>';document.getElementById('hd').innerHTML=dh;}if(d.conflict&&d.conflict.active){var c='<div style="font-size:16px;font-weight:700">Round '+d.conflict.round+'</div>';d.conflict.turnOrder.forEach(function(t,i){c+='<div style="padding:4px 0;'+(i===d.conflict.currentTurn?'color:#e63946;font-weight:700':'color:#7a8a9e')+'">'+t.name+'</div>';});document.getElementById('hcf').innerHTML=c;}else document.getElementById('hcf').innerHTML='<div style="color:#7a8a9e">No conflict</div>';if(d.notes&&d.notes.length){var n='';d.notes.slice(-5).forEach(function(x){n+='<div style="font-size:13px;padding:2px 0;color:#ccc">'+(x.title||x.body||'')+'</div>';});document.getElementById('hn2').innerHTML=n;}};<\/script></body></html>`;}
(function(){try{var hc=new BroadcastChannel('daring-comics-hud');hc.onmessage=function(e){if(e.data&&e.data.type==='ping')hudBroadcast();};}catch(e){}})();

// ═══════════════════════════════════════════════════════════
// MAP
// ═══════════════════════════════════════════════════════════
function defaultRegion(name){
  const cells=Array.from({length:25},(_,i)=>({type:'unknown',isVoid:false,isCurrent:i===12,name:i===12?'':'',icon:'',notes:'',feature:'',subZone:null}));
  return{name:name||'Downtown',cells,currentCell:12};
}
window._mapZoom=null;window._selMapCell=null;
function heroMarker(){return S.char?esc(S.char.costumedName.charAt(0)):'H';}
function isAdj(a,b){const ar=Math.floor(a/5),ac=a%5,br=Math.floor(b/5),bc=b%5;return Math.abs(ar-br)+Math.abs(ac-bc)===1;}
// A game-icons id ("game-icons:city") or bare slug ("city", "fire-ray"). Emoji/free
// text won't match, so legacy emoji icons still render as text.
function isGiSlug(v){return /^(game-icons:)?[a-z0-9]+(?:-[a-z0-9]+)*$/i.test(String(v||''));}
// Render a cell's stored icon big — a game-icon mask (same technique as power icons)
// when the value is a slug, the legacy emoji/text otherwise, or the hero/dot fallback.
function cellIco(c,cur){
  if(c.icon){
    if(isGiSlug(c.icon)){var u=pdIconUrl(c.icon.indexOf(':')>=0?c.icon:'game-icons:'+c.icon);return '<span class="pw-icon cell-gi" style="color:'+(cur?'var(--accent)':'var(--text)')+';-webkit-mask-image:url(\''+u+'\');mask-image:url(\''+u+'\')"></span>';}
    return c.icon;
  }
  return cur?`<span style="color:var(--accent);font-weight:900;font-family:var(--font-title);font-size:22px">${heroMarker()}</span>`:'<span style="color:var(--muted)">·</span>';
}

// ---- Map cell icon picker (same preview + search UX as the power icons) ----
// The currently-edited cell's picker state. Only one cell detail panel is open
// at a time, so a single set of ids/state mirrors the power picker exactly.
var _miScope=null,_miIdx=null,_miVal='',_miDefault='',_miTimer=null;
function giId(v){return v.indexOf(':')>=0?v:'game-icons:'+v;}
function mapIconPreview(){var el=document.getElementById('mi-preview');if(!el)return;el.innerHTML=_miVal?'<span class="pw-icon" style="width:26px;height:26px;color:var(--accent);-webkit-mask-image:url(\''+pdIconUrl(giId(_miVal))+'\');mask-image:url(\''+pdIconUrl(giId(_miVal))+'\')"></span>':'<span style="font-size:9px;color:var(--muted);text-align:center;line-height:1.1">no icon</span>';}
function mapIconResults(icons){var res=document.getElementById('mi-results');if(!res)return;if(!icons||!icons.length){res.innerHTML='<div style="font-size:11px;color:var(--muted);padding:4px">No icons found — try another word (building, tower, skull, factory).</div>';return;}res.innerHTML=icons.map(function(id){var u=pdIconUrl(id);return '<button type="button" class="ic-opt'+(id===_miVal?' sel':'')+'" data-icon="'+esc(id)+'" onclick="selectMapIcon(\''+esc(id)+'\')" title="'+esc(id.replace('game-icons:',''))+'"><span class="pw-icon" style="width:24px;height:24px;-webkit-mask-image:url(\''+u+'\');mask-image:url(\''+u+'\')"></span></button>';}).join('');}
function mapIconSearch(q){var inp=document.getElementById('mi-search');var query=(typeof q==='string'?q:(inp?inp.value:''))||'';var res=document.getElementById('mi-results');var term=query.trim()||_miDefault||'building';clearTimeout(_miTimer);if(res&&!res.innerHTML)res.innerHTML='<div style="font-size:11px;color:var(--muted);padding:4px">Searching game-icons.net…</div>';_miTimer=setTimeout(function(){fetch('https://api.iconify.design/search?query='+encodeURIComponent(term)+'&prefix=game-icons&limit=48').then(function(r){return r.json();}).then(function(d){mapIconResults(d.icons||[]);}).catch(function(){if(res)res.innerHTML='<div style="font-size:11px;color:var(--muted);padding:4px">Couldn\'t reach game-icons.net. Check your connection and try again.</div>';});},250);}
function selectMapIcon(id){_miVal=(id===_miVal)?'':id;mapIconPreview();document.querySelectorAll('#mi-results .ic-opt').forEach(function(b){b.classList.toggle('sel',b.dataset.icon===_miVal);});mapIconCommit();}
function mapIconCommit(){
  if(_miScope==='sz'){if(!window._mapZoom)return;window._mapZoom.subZone.cells[_miIdx].icon=_miVal;var r=S.regions[S.activeRegion];if(r)r.cells[window._mapZoom.cellIdx].subZone=window._mapZoom.subZone;}
  else{var rg=S.regions[S.activeRegion];if(rg)rg.cells[_miIdx].icon=_miVal;}
  save();mapIconUpdateCell();
}
// Repaint just the edited cell in the grid — a full renderMap() would wipe the
// open search results and input focus, so we update the one cell in place.
function mapIconUpdateCell(){
  var grid=document.getElementById('map-grid');if(!grid)return;
  var cellEl=grid.children[_miIdx];if(!cellEl)return;
  var iconEl=cellEl.querySelector('.cell-icon');if(!iconEl)return;
  var cObj,cur;
  if(_miScope==='sz'){cObj=window._mapZoom.subZone.cells[_miIdx];cur=window._mapZoom.subZone.currentCell===_miIdx;}
  else{var r=S.regions[S.activeRegion];cObj=r.cells[_miIdx];cur=r.currentCell===_miIdx;}
  iconEl.innerHTML=cellIco(cObj,cur);
}
// The picker markup for a cell detail panel (matches the power form's layout).
function mapIconField(){
  return '<div class="form-group"><label>Icon <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px">(from game-icons.net)</span></label><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div id="mi-preview" style="width:42px;height:42px;flex-shrink:0;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface2)"></div><input id="mi-search" placeholder="Search icons — building, tower, skull…" oninput="mapIconSearch()"></div><div id="mi-results" style="display:flex;flex-wrap:wrap;gap:5px;max-height:148px;overflow-y:auto"></div></div>';
}

function renderMap(){
  if(!S.regions)S.regions=[defaultRegion()];
  if(S.activeRegion===undefined)S.activeRegion=0;
  const el=document.getElementById('map-content');
  el.innerHTML=renderMapContent();
  if(document.getElementById('mi-preview')){mapIconPreview();mapIconSearch();}
}

function renderMapContent(){
  const region=S.regions[S.activeRegion];if(!region)return'<div class="card">No region data.</div>';

  // SUB-ZONE VIEW
  if(window._mapZoom){
    const sz=window._mapZoom.subZone,szCI=window._mapZoom.cellIdx;
    let g='<div id="map-grid">';
    for(let i=0;i<25;i++){const c=sz.cells[i],cur=sz.currentCell===i,adj=isAdj(sz.currentCell,i)&&!c.isVoid;
      let cls='map-cell';if(c.isVoid)cls+=' void';else if(cur)cls+=' current';else if(adj)cls+=' adjacent';else if(c.type==='explored')cls+=' explored';else cls+=' unexplored';
      const ico=cellIco(c,cur);
      g+=`<div class="${cls}" onclick="clickSZCell(${i})"><span class="cell-num">${i+1}</span><span class="cell-icon">${ico}</span>${c.name?`<span class="cell-name">${esc(c.name)}</span>`:''}</div>`;}
    g+='</div>';
    const si=window._selMapCell??sz.currentCell,sc=sz.cells[si];
    let det='';
    if(sc&&!sc.isVoid){const cur=si===sz.currentCell,adj=isAdj(sz.currentCell,si);
      _miScope='sz';_miIdx=si;_miVal=isGiSlug(sc.icon)?sc.icon:'';_miDefault=sc.name||sz.name||'';
      det=`<div class="card"><div class="fw-700" style="font-size:14px;font-family:var(--font-title);color:var(--accent);margin-bottom:6px">Area ${si+1}: ${esc(sc.name)||'Unknown'}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">${!cur&&adj?`<button class="btn btn-primary btn-xs" onclick="travelSZ(${si})">Travel Here</button>`:''}<button class="btn btn-secondary btn-xs" onclick="toggleSZVoid(${si})">${sc.isVoid?'Clear Void':'Mark Void'}</button></div><div class="form-group"><label>Name</label><input value="${esc(sc.name)}" onchange="setSZProp(${si},'name',this.value)" placeholder="e.g. Rooftop, Lab, Alley..."></div>${mapIconField()}<div class="form-group"><label>Feature</label><input value="${esc(sc.feature)}" onchange="setSZProp(${si},'feature',this.value)" placeholder="e.g. Sniper Nest, Evidence Room..."></div><div class="form-group"><label>Notes</label><textarea rows="2" onchange="setSZProp(${si},'notes',this.value)">${esc(sc.notes)}</textarea></div></div>`;}
    return`<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-xs" onclick="exitSZ()">\u2190 Back to ${esc(region.name)}</button><span class="pg-title" style="font-size:18px;margin:0">${esc(sz.name)}</span>${sz.type?`<span class="tag" style="background:var(--surface3);color:var(--text);border:1px solid var(--border)">${sz.type}</span>`:''}</div><div class="form-group"><label>Zone Name</label><input value="${esc(sz.name)}" onchange="setSZName(this.value)" style="font-weight:700;color:var(--accent)"></div><div style="font-size:10px;color:var(--muted);margin-bottom:8px">Click adjacent area to travel. Click any cell to view/edit.</div>${g}<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted)"><span style="color:var(--accent)">\u25a3 You</span><span style="color:var(--blue)">\u25a3 Adjacent</span><span>\u25a0 Explored</span><span style="opacity:.5">\u25a0 Unexplored</span><span style="opacity:.3">\u25a0 Void</span></div></div>${det}`;
  }

  // NORMAL REGION VIEW
  let sw='<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:10px">';
  S.regions.forEach((r,i)=>{sw+=`<button class="btn btn-xs ${i===S.activeRegion?'btn-primary':'btn-secondary'}" onclick="switchRegion(${i})">${esc(r.name)}</button>`;});
  sw+=`<button class="btn btn-xs btn-gold" onclick="newRegion()">+ New</button></div>`;

  let g='<div id="map-grid">';
  for(let i=0;i<25;i++){const c=region.cells[i],cur=region.currentCell===i,adj=isAdj(region.currentCell,i)&&!c.isVoid;
    let cls='map-cell';if(c.isVoid)cls+=' void';else if(cur)cls+=' current';else if(adj)cls+=' adjacent';else if(c.type==='explored')cls+=' explored';else cls+=' unexplored';
    const ico=cellIco(c,cur);
    g+=`<div class="${cls}" onclick="clickMapCell(${i})"><span class="cell-num">${i+1}</span><span class="cell-icon">${ico}</span>${c.name?`<span class="cell-name">${esc(c.name)}</span>`:''}</div>`;}
  g+='</div>';

  const si=window._selMapCell??region.currentCell,sc=region.cells[si];
  let det='';
  if(sc&&!sc.isVoid){const cur=si===region.currentCell,adj=isAdj(region.currentCell,si);
    _miScope='region';_miIdx=si;_miVal=isGiSlug(sc.icon)?sc.icon:'';_miDefault=sc.name||region.name||'';
    det=`<div class="card"><div class="fw-700" style="font-size:14px;font-family:var(--font-title);color:var(--accent);margin-bottom:6px">Location ${si+1}: ${esc(sc.name)||'Unknown'}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">${!cur&&adj?`<button class="btn btn-primary btn-xs" onclick="travelTo(${si})">Travel Here</button>`:''}<button class="btn btn-secondary btn-xs" onclick="toggleMapVoid(${si})">${sc.isVoid?'Clear Void':'Mark Void'}</button><button class="btn btn-gold btn-xs" onclick="enterSZ(${si})">Zoom In${sc.subZone?' ('+sc.subZone.type+')':''}</button></div><div class="form-group"><label>Location Name</label><input value="${esc(sc.name)}" onchange="setMapProp(${si},'name',this.value)" placeholder="e.g. Wayne Tower, City Hall, Docks..."></div>${mapIconField()}<div class="form-group"><label>Feature</label><input value="${esc(sc.feature)}" onchange="setMapProp(${si},'feature',this.value)" placeholder="e.g. Villain HQ, Hospital, Park..."></div><div class="form-group"><label>Notes</label><textarea rows="2" onchange="setMapProp(${si},'notes',this.value)">${esc(sc.notes)}</textarea></div></div>`;}

  const heroInfo=S.char?`<div class="card-sm" style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:22px;font-weight:900;font-family:var(--font-title);color:var(--accent)">${heroMarker()}</span><div><div style="font-weight:700;color:var(--accent)">${esc(S.char.costumedName)}</div><div style="font-size:10px;color:var(--muted)">${esc(S.char.civilianName)}</div></div></div>`:'';

  return`<div class="pg-title">Region Map</div><div class="pg-sub">Explore the city</div>${sw}<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-size:16px;font-weight:700;font-family:var(--font-title);color:var(--accent)">${esc(region.name)}</span><div style="display:flex;gap:4px"><button class="btn btn-secondary btn-xs" onclick="renameRegion()">Rename</button>${S.regions.length>1?`<button class="btn btn-danger btn-xs" onclick="deleteRegion()">Delete</button>`:''}</div></div>${heroInfo}<div style="font-size:10px;color:var(--muted);margin-bottom:8px">5\u00d75 grid. Click adjacent location to travel. Click any cell to view/edit.</div>${g}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--muted)"><span style="color:var(--accent)">\u25a3 You</span><span style="color:var(--blue)">\u25a3 Adjacent</span><span>\u25a0 Explored</span><span style="opacity:.5">\u25a0 Unexplored</span><span style="opacity:.3">\u25a0 Void</span></div></div>${det}`;
}

// Region operations
function clickMapCell(i){window._selMapCell=i;const r=S.regions[S.activeRegion];if(r)r.cells[i].type='explored';save();renderMap();}
function travelTo(i){const r=S.regions[S.activeRegion];if(!r)return;r.cells[r.currentCell].isCurrent=false;r.currentCell=i;r.cells[i].isCurrent=true;r.cells[i].type='explored';window._selMapCell=i;save();renderMap();}
function setMapProp(i,p,v){const r=S.regions[S.activeRegion];if(r)r.cells[i][p]=v;save();}
function toggleMapVoid(i){const r=S.regions[S.activeRegion];if(r)r.cells[i].isVoid=!r.cells[i].isVoid;save();renderMap();}
function switchRegion(i){S.activeRegion=i;window._selMapCell=null;window._mapZoom=null;save();renderMap();}
function newRegion(){const n=prompt('Region name:','Neighborhood '+(S.regions.length+1));if(!n)return;S.regions.push(defaultRegion(n));S.activeRegion=S.regions.length-1;window._selMapCell=null;save();renderMap();}
function renameRegion(){const r=S.regions[S.activeRegion];if(!r)return;const n=prompt('Rename region:',r.name);if(n)r.name=n;save();renderMap();}
function deleteRegion(){if(S.regions.length<=1)return alert('Cannot delete the only region.');if(!confirm('Delete this region?'))return;S.regions.splice(S.activeRegion,1);S.activeRegion=Math.max(0,S.activeRegion-1);save();renderMap();}

// Sub-zone operations
function enterSZ(ci){
  const r=S.regions[S.activeRegion];if(!r)return;const c=r.cells[ci];
  if(!c.subZone){
    const types=['Building','Street','Underground','Rooftop','Hideout'];
    let h='<div class="card"><div class="pg-title" style="font-size:18px">Zone Type</div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">What kind of location is this?</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
    types.forEach(t=>{const icons={Building:'\ud83c\udfe2',Street:'\ud83c\udfd9',Underground:'\ud83d\ude87',Rooftop:'\ud83c\udf06',Hideout:'\ud83d\udd75'};h+=`<button class="btn btn-primary" style="padding:12px;font-size:13px" onclick="createSZ(${ci},'${t}')">${icons[t]||''} ${t}</button>`;});
    h+='</div></div>';
    document.getElementById('map-content').innerHTML=h;return;
  }
  window._mapZoom={cellIdx:ci,subZone:c.subZone};window._selMapCell=null;renderMap();
}
function createSZ(ci,type){
  const r=S.regions[S.activeRegion];if(!r)return;const c=r.cells[ci];
  c.subZone={name:c.name||('Area '+(ci+1)),type,currentCell:12,cells:Array.from({length:25},()=>({name:'',icon:'',isVoid:false,notes:'',feature:'',type:'unknown'}))};
  save();window._mapZoom={cellIdx:ci,subZone:c.subZone};window._selMapCell=null;renderMap();
}
function exitSZ(){window._mapZoom=null;window._selMapCell=null;renderMap();}
function setSZName(v){if(!window._mapZoom)return;window._mapZoom.subZone.name=v;const r=S.regions[S.activeRegion];if(r)r.cells[window._mapZoom.cellIdx].subZone=window._mapZoom.subZone;save();}
function setSZProp(i,p,v){if(!window._mapZoom)return;window._mapZoom.subZone.cells[i][p]=v;const r=S.regions[S.activeRegion];if(r)r.cells[window._mapZoom.cellIdx].subZone=window._mapZoom.subZone;save();}
function clickSZCell(i){if(!window._mapZoom)return;window._selMapCell=i;window._mapZoom.subZone.cells[i].type='explored';const r=S.regions[S.activeRegion];if(r)r.cells[window._mapZoom.cellIdx].subZone=window._mapZoom.subZone;save();renderMap();}
function travelSZ(i){if(!window._mapZoom)return;const sz=window._mapZoom.subZone;sz.currentCell=i;sz.cells[i].type='explored';window._selMapCell=i;const r=S.regions[S.activeRegion];if(r)r.cells[window._mapZoom.cellIdx].subZone=sz;save();renderMap();}
function toggleSZVoid(i){if(!window._mapZoom)return;window._mapZoom.subZone.cells[i].isVoid=!window._mapZoom.subZone.cells[i].isVoid;const r=S.regions[S.activeRegion];if(r)r.cells[window._mapZoom.cellIdx].subZone=window._mapZoom.subZone;save();renderMap();}

// ═══════════════════════════════════════════════════════════
// UTILITY & INIT
// ═══════════════════════════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const HERO_NAME_A=['Captain','Doctor','Iron','Shadow','Ultra','Crimson','Silver','Phantom','Atomic','Mystic','Storm','Night','Star','Hyper','Omega','Cosmic','Mighty','Thunder','Turbo','Rogue','Dark','Quantum','Blaze','Titan','Venom','Neon','Cyber','Cryo','Pyro','Emerald','Obsidian','Onyx','Solar','Lunar','Primal','Apex','Ghost','Royal','Savage','Steel','Raven','Scarlet','Golden','Jade','Cobalt','Rapid','Inferno','Nova','Volt','Hex'];
const HERO_NAME_B=['Hawk','Fist','Bolt','Shield','Blade','Fury','Strike','Wing','Star','Knight','Storm','Fire','Mask','Pulse','Force','Arrow','Sentinel','Vanguard','Phoenix','Hunter','Specter','Hammer','Talon','Blaze','Guardian','Patriot','Crusader','Wolf','Falcon','Frost','Surge','Shadow','Valor','Justice','Marvel','Siren','Titan','Oracle','Reaper','Wraith','Dynamo','Aegis','Phantom','Ronin','Warden','Dusk','Zenith','Lance','Panther','Spark'];

// One non-streaming completion. Returns the reply text. Throws with a message
// worth showing the user — this is the only AI surface in the app, so a silent
// failure here reads as "the button is broken".
async function llmChat(opts){
  const c=llmConfig();
  if(!llmReady())throw new Error('No AI backend configured — open AI Setup from the Wiki tab.');
  return c.backend==='gemini'?llmGemini(c,opts):llmLocal(c,opts);
}
async function llmGemini(c,opts){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.geminiModel)+':generateContent?key='+encodeURIComponent(c.geminiKey.trim());
  const body={
    systemInstruction:{parts:[{text:opts.system||''}]},
    contents:[{role:'user',parts:[{text:opts.user||''}]}],
    generationConfig:{temperature:opts.temperature==null?0.2:opts.temperature,maxOutputTokens:opts.maxTokens||8192}
  };
  if(opts.jsonMode)body.generationConfig.responseMimeType='application/json';
  // Gemini 3.x thinks by default and that thinking spends the same output
  // budget, which can truncate a large lore-intake reply. Extraction needs
  // no visible reasoning. thinkingLevel is the 3.x knob — gemini-3.5-flash-lite
  // rejects thinkingBudget with INVALID_ARGUMENT. Verified live 2026-08-21.
  if(opts.jsonMode&&/^gemini-3/i.test(c.geminiModel))body.generationConfig.thinkingConfig={thinkingLevel:'low'};
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json().catch(function(){return null;});
  if(!r.ok){
    const msg=(data&&data.error&&data.error.message)||('HTTP '+r.status);
    if(r.status===400&&/API key/i.test(msg))throw new Error('Gemini rejected the API key. Check it in AI Setup.');
    if(r.status===429)throw new Error('Gemini rate limit hit. Wait a minute and try again.');
    throw new Error('Gemini error: '+msg);
  }
  const cand=(data&&data.candidates&&data.candidates[0])||null;
  if(!cand){
    const blocked=data&&data.promptFeedback&&data.promptFeedback.blockReason;
    throw new Error(blocked?('Gemini blocked the request ('+blocked+'). Try rewording the notes.'):'Gemini returned no result.');
  }
  if(cand.finishReason==='MAX_TOKENS')console.warn('[wiki] Gemini hit the token cap — the reply may be truncated.');
  return ((cand.content&&cand.content.parts)||[]).map(function(p){return p.text||'';}).join('');
}
async function llmLocal(c,opts){
  const base=c.localUrl.trim().replace(/\/+$/,'');
  const headers={'Content-Type':'application/json'};
  if(c.localKey.trim())headers['Authorization']='Bearer '+c.localKey.trim();
  const body={
    messages:[{role:'system',content:opts.system||''},{role:'user',content:opts.user||''}],
    temperature:opts.temperature==null?0.2:opts.temperature,
    max_tokens:opts.maxTokens||8192,stream:false
  };
  if(c.localModel.trim())body.model=c.localModel.trim();
  if(opts.jsonMode)body.response_format={type:'json_object'};
  let r;
  try{r=await fetch(base+'/chat/completions',{method:'POST',headers:headers,body:JSON.stringify(body)});}
  catch(e){throw new Error('Couldn\'t reach '+base+'. Is the local server running, and does it allow requests from this page (CORS)?');}
  const data=await r.json().catch(function(){return null;});
  if(!r.ok)throw new Error('Local model error: '+((data&&data.error&&(data.error.message||data.error))||('HTTP '+r.status)));
  const ch=(data&&data.choices&&data.choices[0])||null;
  if(!ch)throw new Error('The local model returned no result.');
  return (ch.message&&ch.message.content)||ch.text||'';
}

// ─── Parsing model output ─────────────────────────────────
// Never trust the model's formatting. Try strict JSON, then a repaired parse,
// then an [...] substring, then a brace scan that digs objects out of prose.
// Everything that survives goes through sanitizeLore, which is what actually
// makes the data safe — anything without a usable name is dropped, not shown.
function _loreRelaxedParse(s){
  try{return JSON.parse(s);}catch(e){}
  try{return JSON.parse(String(s).replace(/,\s*([}\]])/g,'$1'));}catch(e){return undefined;}
}
function _loreScanObjects(s){
  const out=[];let depth=0,start=-1,inStr=false,esc=false,q='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c===q)inStr=false;continue;}
    if(c==='"'||c==="'"){inStr=true;q=c;}
    else if(c==='{'){if(depth===0)start=i;depth++;}
    else if(c==='}'){if(depth>0){depth--;if(depth===0&&start>=0){out.push(s.slice(start,i+1));start=-1;}}}
  }
  return out;
}
function _loreArr(v){
  let list=[];
  if(Array.isArray(v))list=v;else if(typeof v==='string')list=v.split(',');
  return list.map(x=>String(x==null?'':x).replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,12);
}
function sanitizeLore(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return null;
  const name=String(o.name==null?'':o.name).replace(/\s+/g,' ').trim();
  if(!name||name.length>100)return null; // a sentence, not an entry name
  let type=String(o.type==null?'':o.type).toLowerCase().trim();
  if(!LORE_TYPES.some(t=>t.id===type))type='lore';
  const clean=function(val,cap){
    let s=String(val==null?'':val).replace(/```[\s\S]*?```/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
    if(s.length>cap)s=s.slice(0,cap).trim()+'…';
    return s;
  };
  const out={type:type,name:name,aliases:_loreArr(o.aliases),tags:_loreArr(o.tags),body:clean(o.body,6000)};
  if(o.hidden===true||o.hidden==='true')out.hidden=true;
  const secret=clean(o.secret,2000);if(secret)out.secret=secret;
  return out;
}
function parseLoreBlocks(text){
  const candidates=[];
  const addFrom=function(v){
    if(Array.isArray(v))v.forEach(addFrom);
    else if(v&&typeof v==='object'){
      if(Array.isArray(v.entries))v.entries.forEach(addFrom);
      else candidates.push(v);
    }
  };
  let t=String(text||'').trim();
  // Parse the raw reply BEFORE unwrapping any fence. A body that itself
  // contains a ``` block would otherwise get mistaken for the wrapper and
  // shred the whole payload; sanitizeLore strips stray fences from bodies.
  const whole=_loreRelaxedParse(t);
  if(whole!==undefined)addFrom(whole);
  if(!candidates.length){
    const fence=t.match(/```(?:json)?[ \t]*\r?\n?([\s\S]*?)```/i);
    if(fence){t=fence[1].trim();const inner=_loreRelaxedParse(t);if(inner!==undefined)addFrom(inner);}
  }
  if(!candidates.length){
    const open=t.indexOf('['),close=t.lastIndexOf(']');
    if(open>=0&&close>open){const arr=_loreRelaxedParse(t.slice(open,close+1));if(arr!==undefined)addFrom(arr);}
  }
  if(!candidates.length)_loreScanObjects(t).forEach(function(chunk){const o=_loreRelaxedParse(chunk);if(o!==undefined)addFrom(o);});
  const cleaned=[];
  candidates.forEach(function(o){const s=sanitizeLore(o);if(s)cleaned.push(s);});
  return cleaned;
}

// A name like "the masked woman" is a placeholder; "Selina Vane" is a real
// name. Used to retitle an entry in place once a figure is properly named.
function isDescriptiveHandle(n){
  const s=String(n||'').trim();
  if(!s)return true;
  if(/^(the|a|an) /i.test(s))return true;
  return !/[A-Z]/.test(s.slice(1))&&s.split(/\s+/).length>1;
}

// Match on incoming name OR any incoming alias against existing name-or-alias,
// so a record carrying a newly-learned name plus the old handle updates the
// entry instead of duplicating it. Bodies APPEND rather than overwrite.
function upsertLore(data){
  const name=String(data.name||'').trim();if(!name)return null;
  const list=listLore();
  const incoming=[name].concat(data.aliases||[]).map(n=>String(n||'').trim().toLowerCase()).filter(Boolean);
  const found=list.find(function(e){
    const names=[e.name].concat(e.aliases||[]).map(n=>String(n||'').toLowerCase());
    return names.some(n=>incoming.indexOf(n)>=0);
  });
  if(found){
    found.aliases=found.aliases||[];found.tags=found.tags||[];
    if(name.toLowerCase()!==found.name.toLowerCase()&&isDescriptiveHandle(found.name)&&!isDescriptiveHandle(name)){
      if(found.aliases.indexOf(found.name)<0)found.aliases.push(found.name);
      found.name=name;
    }
    const oldBody=String(found.body||'').trim(),newBody=String(data.body||'').trim();
    if(newBody){
      if(!oldBody)found.body=newBody;
      else if(newBody.indexOf(oldBody)>=0)found.body=newBody;                     // new supersedes
      else if(oldBody.indexOf(newBody)<0)found.body=oldBody+'\n\n'+newBody;       // genuinely new
      // else: already covered — leave it alone so re-runs don't bloat the entry
    }
    if(data.type)found.type=data.type;
    if(data.hidden===true)found.hidden=true;
    if(data.secret&&String(data.secret).trim())found.secret=String(data.secret).trim();
    (data.aliases||[]).forEach(function(a){if(a&&found.aliases.indexOf(a)<0&&a.toLowerCase()!==found.name.toLowerCase())found.aliases.push(a);});
    (data.tags||[]).forEach(function(t){if(t&&found.tags.indexOf(t)<0)found.tags.push(t);});
    saveLoreEntry(found);
    return{updated:true,entry:found};
  }
  const entry=Object.assign(blankLoreEntry(data.type),{
    type:data.type||'lore',name:name,aliases:data.aliases||[],tags:data.tags||[],
    body:data.body||'',secret:data.secret||'',hidden:data.hidden===true,createdBy:'llm'
  });
  saveLoreEntry(entry);
  return{updated:false,entry:entry};
}

// ─── Intake prompt ────────────────────────────────────────
// A filing clerk, not a GM: no narration, no invented plot, no commentary.
function loreIntakePrompt(existingNames){
  const lines=[
    'You are an archivist for a superhero comic-book RPG universe. The user has given you freeform notes about their world.',
    'Your ONLY job is to file the facts in those notes into wiki entries. Do NOT narrate, do NOT address the user, do NOT write commentary, and do NOT invent plot developments. Record only what the notes state or clearly imply.',
    'Be thorough: capture every person, place, team, significant object, and incident described. Keep distinct things in SEPARATE entries — never lump several subjects into one entry. Put each fact in the entry it belongs to.',
    '',
    'Entry types — pick the best fit for each:',
    '- "character": any individual person — heroes, villains, supporting cast, civilians.',
    '- "location": cities, neighborhoods, bases, headquarters, landmarks, other dimensions.',
    '- "organization": teams, agencies, corporations, criminal syndicates, cults.',
    '- "item": artifacts, signature equipment, vehicles, macguffins.',
    '- "event": incidents that happened — origins, disasters, battles, crimes.',
    '- "lore": background concepts, history, rules of the setting, power sources.',
    '- "plot": ongoing threads, unresolved mysteries, schemes in motion.',
    '',
    'Return ONLY a JSON array. No prose before or after it. Each element:',
    '{"type":"character","name":"Doctor Malice","aliases":["Elias Kane"],"tags":["villain","gotham"],"body":"What is known about them.","secret":"GM-only twist, optional.","hidden":false}',
    '',
    '"name" is the common name — short, under 100 characters, never a sentence.',
    '"aliases" holds other names the same subject goes by (real name, codename, nicknames). This is how entries get matched later, so include them.',
    '"body" is plain prose. No markdown headers, no bullet syntax, no code fences.',
    'Set "hidden": true only when the notes mark something as a secret the players should not see. Use "secret" for a GM-only detail attached to an otherwise public entry.'
  ];
  if(existingNames&&existingNames.length){
    lines.push('','Already in the wiki. To ADD to one of these, reuse its EXACT name — that updates the entry instead of creating a duplicate:');
    lines.push(existingNames.slice(0,200).map(n=>'- '+n).join('\n'));
  }
  return lines.join('\n');
}

// Two-way links found by scanning text for other entries' names and aliases.
// Word-boundary matched so "Kane" doesn't light up inside "Kanetown", and
// short names are skipped because they produce nothing but false positives.
function _loreMentions(text,entry){
  const hay=String(text||'');
  if(!hay)return[];
  return listLore().filter(function(o){
    if(o.id===entry.id)return false;
    return [o.name].concat(o.aliases||[]).some(function(n){
      n=String(n||'').trim();
      if(n.length<4)return false;
      return new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(hay);
    });
  });
}
function loreRelated(entry){
  const out=_loreMentions((entry.body||'')+'\n'+(entry.secret||''),entry);
  const outIds=out.map(o=>o.id);
  const inc=listLore().filter(function(o){
    if(o.id===entry.id||outIds.indexOf(o.id)>=0)return false;
    if(o.hidden&&!_wikiShowHidden)return false;
    return _loreMentions((o.body||'')+'\n'+(o.secret||''),o).some(m=>m.id===entry.id);
  });
  return{out:out.filter(o=>!o.hidden||_wikiShowHidden),in:inc};
}

function delLore(id){
  const e=listLore().find(x=>x.id===id);if(!e)return;
  if(!confirm('Delete "'+e.name+'"? This removes it for every hero in this universe.'))return;
  deleteLoreEntry(id);renderWiki();
}

async function runWikiIntake(){
  const ta=document.getElementById('wiki-intake');
  const text=(ta?ta.value:'').trim();
  if(!text||_wikiBusy)return;
  if(!currentUniverse()){alert('Create a universe first.');return;}
  if(!llmReady()){_wikiStatus='';openAISetup();return;}
  _wikiIntakeText=text;_wikiBusy=true;_wikiStatus='';renderWiki();
  try{
    const existing=listLore().map(e=>e.name);
    const reply=await llmChat({system:loreIntakePrompt(existing),user:text,jsonMode:true,maxTokens:8192,temperature:0.2});
    const datas=parseLoreBlocks(reply);
    console.log('[wiki] parsed '+datas.length+' entries from '+(reply||'').length+' chars',datas.length?'':reply);
    let created=0,updated=0;
    datas.forEach(function(d){const r=upsertLore(d);if(!r)return;if(r.updated)updated++;else created++;});
    if(!datas.length){
      _wikiStatus='Nothing filed — try naming specific people, places or teams.';
    }else{
      _wikiIntakeText='';
      _wikiStatus=created+' added, '+updated+' updated.';
      flashSaved();
    }
  }catch(err){
    console.error(err);
    _wikiStatus=err.message;
  }
  _wikiBusy=false;renderWiki();
}

      h+=`<div class="card-sm"><div class="label mb-1">Related</div>`;
      if(rel.out.length)h+=`<div style="font-size:10px;color:var(--muted);margin-bottom:3px">Mentioned here</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">${rel.out.map(r=>`<button class="btn btn-secondary btn-xs" onclick="openLoreEditor('${r.id}')">${loreTypeDef(r.type).ico} ${esc(r.name)}</button>`).join('')}</div>`;
      if(rel.in.length)h+=`<div style="font-size:10px;color:var(--muted);margin-bottom:3px">Mentions this</div><div style="display:flex;flex-wrap:wrap;gap:4px">${rel.in.map(r=>`<button class="btn btn-secondary btn-xs" onclick="openLoreEditor('${r.id}')">${loreTypeDef(r.type).ico} ${esc(r.name)}</button>`).join('')}</div>`;
      h+=`</div>`;
    }
  }

  h+=`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-secondary" style="flex:1" onclick="closeLoreEditor()">${_wikiEditMode?'Cancel':'Close'}</button>`;
  if(_wikiEditMode){
    if(_wikiOpenId)h+=`<button class="btn btn-danger" onclick="if(confirm('Delete this entry?')){deleteLoreEntry('${_wikiOpenId}');closeLoreEditor();}">Delete</button>`;
    h+=`<button class="btn btn-primary" style="flex:1" onclick="saveLoreFromEditor()">Save</button>`;
  }
  h+=`</div></div>`;
  document.getElementById('lore-modal-body').innerHTML=h;
}
function _loreReadEditor(){
  const g=id=>document.getElementById(id),split=v=>String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
  const e=window._loreDraft||blankLoreEntry();
  e.type=g('lore-type')?.value||e.type;
  e.name=(g('lore-name')?.value||'').trim();
  e.aliases=split(g('lore-aliases')?.value);
  e.tags=split(g('lore-tags')?.value);
  e.body=g('lore-body')?.value||'';
  e.secret=g('lore-secret')?.value||'';
  e.hidden=!!(g('lore-hidden')&&g('lore-hidden').checked);
  return e;
}
function saveLoreFromEditor(){
  const e=_loreReadEditor();
  if(!e.name){alert('Name required');return;}
  saveLoreEntry(e);
  _wikiOpenId=e.id;
  flashSaved();closeLoreEditor();
}
function setLoreNPC(npcId){
  const e=_loreReadEditor();
  e.npcId=npcId||null;
  saveLoreEntry(e);_wikiOpenId=e.id;renderLoreEditor();
}
// Spin a roster NPC out of a lore entry: name and blurb carry over, stats are
// built in the NPC Builder. The two stay joined by id, not duplicated.
function createNPCFromLore(){
  const e=_loreReadEditor();
  if(!e.name){alert('Give the entry a name first.');return;}
  const npc=ensureId({type:'rogue',name:e.name,desc:(e.body||'').slice(0,200),aspects:[],skills:{},
    forms:[{name:'Main Form',powerSets:[],gear:[]}],activeForm:0,stunts:[],
    stress:Array(4).fill(false),consequences:{mild:'',moderate:'',severe:''}});
  S.npcs.push(npc);save();
  e.npcId=npc.id;saveLoreEntry(e);_wikiOpenId=e.id;
  closeLoreEditor();
  showTab('npcs');_npcTab='rogue';openFullNPCBuilder(S.npcs.indexOf(npc));
}
function gotoLinkedNPC(npcId){
  const i=S.npcs.findIndex(n=>n.id===npcId);
  if(i<0){alert('That NPC is no longer on the roster.');return;}
  closeLoreEditor();showTab('npcs');_npcTab=S.npcs[i].type||'rogue';openFullNPCBuilder(i);
}

document.addEventListener('click',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('modal-overlay')&&!e.target.classList.contains('locked'))e.target.classList.remove('open');});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(function(m){if(!m.classList.contains('locked'))m.classList.remove('open');});});
// ═══════════════════════════════════════════════════════════
// MULTIPLAYER (optional — see MULTIPLAYER.md)
// ═══════════════════════════════════════════════════════════
// With no config the app is exactly the offline app it was: no SDK is fetched,
// no network call is made, and the Multiplayer button explains what to do.
// The config lives in firebase-config.js, loaded on demand so a solo session
// never touches it — see MULTIPLAYER.md. It sits in its own small file so a
// fork can point at a different Firebase project without editing this one.
window.FIREBASE_CONFIG=window.FIREBASE_CONFIG||{
  apiKey:'', authDomain:'', databaseURL:'', projectId:'', appId:''
};
const FIREBASE_SDK='https://www.gstatic.com/firebasejs/10.8.0/';
let _mpLoading=null;
function mpConfigured(){return !!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.FIREBASE_CONFIG.databaseURL);}
function _loadScript(src){
  return new Promise(function(res,rej){
    const s=document.createElement('script');
    s.src=src;s.async=false;
    s.onload=res;s.onerror=function(){rej(new Error('Could not load '+src));};
    document.head.appendChild(s);
  });
}
// Lazy: the Firebase SDK is ~300KB and most sessions are solo, so nothing is
// fetched until the player actually asks for multiplayer.
// Best-effort: a fork may have removed firebase-config.js to point elsewhere,
// and file:// gives it no origin to load from, so a failure here is handled
// rather than thrown — the offline app carries on regardless.
let _cfgTried=false;
async function _loadLocalConfig(){
  if(_cfgTried)return;
  _cfgTried=true;
  try{await _loadScript('firebase-config.js');}catch(e){}
}
function openMultiplayer(){
  if(window.MP&&window.DC_BOOT_MP){DC_MP.openLobby();return;}
  if(_mpLoading)return;
  _mpLoading=(async function(){
    await _loadLocalConfig();
    if(!mpConfigured()){
      _mpLoading=null;
      alert('Multiplayer could not start \u2014 firebase-config.js did not load.\n\nIf you opened index.html straight from disk, that is why: Google sign-in needs a real origin. Serve this folder over http instead (run \"npx serve\" in it), or use the hosted copy.\n\nIf this is your own fork, copy firebase-config.example.js to firebase-config.js and fill in your Firebase web config, then paste the security rules from MULTIPLAYER.md into the Firebase console.\n\nEverything else in the app works without it.');
      return;
    }
    try{
      await _loadScript(FIREBASE_SDK+'firebase-app-compat.js');
      await _loadScript(FIREBASE_SDK+'firebase-auth-compat.js');
      await _loadScript(FIREBASE_SDK+'firebase-database-compat.js');
      await _loadScript('dc-mp.js');
      await _loadScript('dc-app-mp.js');
      DC_BOOT_MP(window.FIREBASE_CONFIG);
    }catch(e){
      _mpLoading=null;
      alert('Could not load multiplayer: '+e.message+'\n\nCheck your connection — the rest of the app still works offline.');
    }
  })();
}

(function boot(){
  loadUniverses();
  if(U.universes.length===0){openUniverseSetup(true);return;}
  migrateSlotsToSaves();
  loadSaves();
  if(!saveIndexHealthy())rebuildSaveIndex();
  migrateUniverseSeries();
  if(SV.activeId&&getSaveData(SV.activeId))loadSave(SV.activeId);
  else{
    const first=listSaves().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    if(first)loadSave(first.id);
  }
  renderHero();
  if(currentSaveId===null)openSlotModal();
})();
